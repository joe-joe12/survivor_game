<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>寶可夢倖存者</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>
class GameScene extends Phaser.Scene {
    constructor() {
        super('GameScene');
        this.exp = 0;
        this.maxExp = 5;
        this.level = 1;
        this.moveSpeed = 180;
        
        // 地圖設定
        this.mapSize = 2000;
        
        // 搖桿控制變數
        this.joystickPointer = null;
        this.joystickBasePos = { x: 0, y: 0 };
        this.joystickDir = { x: 0, y: 0 };
    }

    create() {
        // 1. 設定遊戲世界邊界 (2000x2000 大地圖)
        this.physics.world.setBounds(0, 0, this.mapSize, this.mapSize);

        // 2. 畫出背景棋盤格與邊界線
        let bgGraphics = this.add.graphics();
        let gridSize = 80;
        bgGraphics.lineStyle(1, 0x333333, 0.8);
        for (let x = 0; x <= this.mapSize; x += gridSize) {
            bgGraphics.moveTo(x, 0);
            bgGraphics.lineTo(x, this.mapSize);
        }
        for (let y = 0; y <= this.mapSize; y += gridSize) {
            bgGraphics.moveTo(0, y);
            bgGraphics.lineTo(this.mapSize, y);
        }
        bgGraphics.strokePath();
        
        // 繪製地圖外圍邊框 (紅色危險線)
        bgGraphics.lineStyle(6, 0xff2222, 1);
        bgGraphics.strokeRect(0, 0, this.mapSize, this.mapSize);

        // 3. 建立玩家 (藍色圓圈)
        this.player = this.add.circle(this.mapSize / 2, this.mapSize / 2, 15, 0x0
