            let icon = cat.key === 'c' ? this.add.image(x, y - 20, 'hero' + it.id).setDepth(2) : this.add.text(x, y - 20, it.ic, { fontSize: '36px' }).setOrigin(0.5).setDepth(2);
            if (!got) { if (icon.setTintFill) icon.setTintFill(0x1b2130); else icon.setAlpha(0.15); }   // 未擁有：剪影
            this.dyn.push(g, zone, icon,
                this.add.text(x, y + 28, got ? it.name : '???', { fontSize: '15px', color: got ? '#fff' : '#555', fontStyle: 'bold' }).setOrigin(0.5).setDepth(2),
                this.add.text(x, y + 47, RAR[it.r].n + (got ? ' ' + starStr(cat.key, it.id) : ''), { fontSize: '11px', color: hex(got ? rc : 0x444444) }).setOrigin(0.5).setDepth(2));
        });
    }
    show(cat, it, got) {
        if (!got) { this.detail.setText('尚未解鎖，去抽獎看看吧！'); return; }
        let d = `${it.name}（${RAR[it.r].n}）${starStr(cat.key, it.id)}\n\n${it.desc}\n\n每星加成：${STAR_TXT[cat.key]}`;
        if (cat.key === 'w') { const wm = wmetaOf(it.id); d += `\n專武：${CHARACTERS[it.excl].name}（傷害+25%、數量+1）\n專屬升級：${it.spec.name}\n養成：射速 Lv${wm.rate}　範圍 Lv${wm.range}　專屬 Lv${wm.spec}`; }
        if (cat.key === 'c') { const m = metaOf(it.id); d += `\n\n血量${it.hp}　速度${it.speed}　傷害×${it.dmg}　射程${it.range}\n技能「${it.sk.name}」Lv${m.skill}：${it.sk.txt(m.skill)}`; }
        this.detail.setText(d);
    }
}

// ============================================================
//  遊戲本體
// ============================================================
class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    create(data) {
        makeTextures(this);
        this.cfg = data;
        const ch = this.char = CHARACTERS[data.c], wp = this.wp = WEAPONS[data.w];
        const ps = this.ps = data.p >= 0 ? scalePassive(PASSIVES[data.p], starOf('p', data.p)) : {};
        const sc = starOf('c', ch.id), sw = starOf('w', wp.id);
        const meta = metaOf(ch.id), wm = wmetaOf(wp.id);       // 局外養成資料（角色 / 武器各自獨立）

        // ---------- 數值計算：基礎 × 升星 × 被動 × 養成 ----------
        this.excl = wp.excl === ch.id;                          // 專武啟動：傷害×1.25、數量+1
        const sp = wp.spec, spl = wm.spec;                      // 武器專屬升級
        this.wn = wp.n + (this.excl ? 1 : 0) + (sp.kind === 'count' ? spl : 0);                          // 數量（散彈發數 / 環繞星數 / 光束道數）
        this.pierceCount = (wp.type === 'pierce' ? this.wn : 0) + (sp.kind === 'pierce' ? Math.floor(spl / (sp.div || 1)) : 0);   // 穿透數
        this.chainCount = (wp.type === 'chain' ? this.wn : 0) + (sp.kind === 'chain' ? spl : 0);          // 彈射數
        this.maxHp = Math.round(ch.hp * (1 + 0.05 * sc) * (ps.hpMul || 1)); this.hp = this.maxHp;
        this.moveSpeed = Math.round(ch.speed * (ps.spdMul || 1) * (1 + 0.02 * meta.spd));
        this.attackDamage = BASE_ENEMY_HP * 0.4 * ch.dmg * (1 + 0.04 * sc) * wp.dmg * (1 + 0.05 * sw) * (ps.dmgMul || 1) * (this.excl ? 1.25 : 1) * (1 + 0.05 * meta.atk);
        this.attackDelay = ch.delay * wp.delay * (ps.atkMul || 1) / (1 + 0.05 * wm.rate);               // 射速養成：間隔縮短
        this.bulletRange = Math.round(ch.range * (1 + 0.05 * wm.range)); this.bulletSpeed = 600;          // 射程養成
        this.orbR = 90 * (1 + 0.05 * wm.range); this.orbCd = 450 / (1 + 0.05 * wm.rate);                  // 環繞星：範圍 → 半徑；射速 → 命中冷卻
        this.defFlat = 0.4 * meta.def; this.redPct = 0.015 * meta.red;                                    // 防禦（固定減傷）/ 減傷（百分比）
        this.critRate = 0.05 + 0.02 * meta.crit; this.critMul = 1.5 + 0.05 * meta.cdmg;                   // 暴擊

        // ---------- 角色技能（innate 天生有；其他角色需養成到 Lv1）----------
        const sl = this.sl = meta.skill; this.skOn = !!ch.innate || sl > 0;
        this.dodgeChance = ch.trait === 'dodge' ? 0.2 + 0.02 * sl : 0;
        this.nextNova = (10 - 0.4 * sl) * 1000;                // 星環：下次星爆時間
        this.nextHeal = 15000;                                 // 曉光：下次回血時間
        this.nextGale = 4000; this.galeUntil = 0;              // 翠風：疾風
        this.thornCd = 0;                                      // 岩盾：反擊冷卻
        this.frenzyNeed = Math.max(10, 20 - sl); this.frenzyDur = (5 + 0.3 * sl) * 1000; this.frenzyDmg = 0.4 + 0.02 * sl;   // 終焉：狂暴

        // ---------- 戰鬥狀態 ----------
        this.exp = 0; this.maxExp = 5; this.level = 1; this.kills = 0; this.pending = 0;      // pending = 尚未選擇的升級次數
        this.elapsed = 0; this.lastSec = -1; this.lastUi = 0; this.slowUntil = 0; this.slowShown = false;
        this.frenzyUntil = 0; this.frenzyKills = 0; this.revived = false; this.orbA = 0;
        this.isGameOver = false; this.isUpgrading = false; this.isInvincible = true; this.hurtCD = false;
        this.joystickDir = { x: 0, y: 0 }; this.touchPointer = null; this._pull = { x: 0, y: 0 };
        // 本局金幣統計（結算時發放）
        this.coinF = 0; this.bossCoins = 0; this.npcCoins = 0; this.npcTickets = 0; this.bossKills = 0;
        this.bossActive = false; this.boss = null;

        // ---------- 背景與圖層 ----------
        this.cameras.main.setBackgroundColor('#090d1c');
        this.bg = this.add.tileSprite(0, 0, W, H, 'bg').setOrigin(0).setScrollFactor(0).setDepth(0);
        this.stars = this.add.tileSprite(0, 0, W, H, 'stars').setOrigin(0).setScrollFactor(0).setDepth(1);
        this.fieldGfx = this.add.graphics().setDepth(2);       // 星球引力場圈線
        this.aimGfx = this.add.graphics().setDepth(149);       // 手動瞄準指示
        this.bossTint = this.add.rectangle(W / 2, H / 2, W, H, 0xff0033, 0.08).setScrollFactor(0).setDepth(4).setVisible(false);   // BOSS 戰的紅色氛圍

        this.player = this.physics.add.sprite(0, 0, 'hero' + ch.id).setDepth(10);
        this.player.body.setCircle(16, 10, 10);
        this.time.delayedCall(2000, () => { this.isInvincible = false; });                  // 開場 2 秒無敵
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.hpGfx = this.add.graphics().setDepth(20);

        // ---------- 操作：浮動搖桿 + 鍵盤 + 空白鍵手動瞄準 ----------
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({ up: 'W', down: 'S', left: 'A', right: 'D' });
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);   // 按住 = 手動瞄準模式
        this.joyBase = this.add.circle(0, 0, 55, 0xffffff, 0.18).setStrokeStyle(2, 0xffffff, 0.4).setScrollFactor(0).setDepth(100).setVisible(false);
        this.thumb = this.add.circle(0, 0, 26, 0xffffff, 0.5).setScrollFactor(0).setDepth(101).setVisible(false);
        this.input.on('pointerdown', (p) => {
            if (this.isGameOver || this.isUpgrading || this.touchPointer) return;
            this.touchPointer = p; this.baseX = p.x; this.baseY = p.y;
            this.joyBase.setPosition(p.x, p.y).setVisible(true); this.thumb.setPosition(p.x, p.y).setVisible(true);
        });
        this.input.on('pointermove', (p) => {
            if (this.isGameOver || this.isUpgrading || !this.touchPointer || p.id !== this.touchPointer.id) return;
            this.updateJoystick(p);
        });
        const up = (p) => { if (this.touchPointer && p.id === this.touchPointer.id) this.resetJoystick(); };
        this.input.on('pointerup', up); this.input.on('pointerupoutside', up);

        // ---------- 物件群組 ----------
        this.enemies = this.physics.add.group(); this.bullets = this.physics.add.group();
        this.eBullets = this.physics.add.group(); this.gems = this.physics.add.group(); this.orbs = this.physics.add.group();
        this.sats = this.physics.add.group(); this.planets = this.physics.add.group(); this.ships = this.physics.add.group();
        this.npcs = this.physics.add.group(); this.rifts = this.physics.add.group();

        // 環繞星武器：建立環繞球並設定碰撞傷害
        if (wp.type === 'orbit') {
            for (let i = 0; i < this.wn; i++) {
                let o = this.add.circle(0, 0, 11, 0xffd24a).setStrokeStyle(3, 0xffffff).setDepth(30);
                this.physics.add.existing(o); o.body.setCircle(11); this.orbs.add(o);
            }
            const orbHit = (o, e) => {
                if (!e.active || this.elapsed < (e.orbCd || 0)) return;
                e.orbCd = this.elapsed + this.orbCd; this.damageEnemy(e, this.dmgNow());
            };
            this.physics.add.overlap(this.orbs, this.enemies, orbHit);
            this.physics.add.overlap(this.orbs, this.sats, orbHit);
            this.physics.add.overlap(this.orbs, this.npcs, orbHit);
        }

        // ---------- HUD ----------
        this.expGfx = this.add.graphics().setScrollFactor(0).setDepth(200);
        this.hudBg = this.add.graphics().setScrollFactor(0).setDepth(199);
        this.uiText = this.add.text(24, 28, '', { fontSize: '13px', color: '#e6eeff', lineSpacing: 5 }).setScrollFactor(0).setDepth(200);
        this.bossGfx = this.add.graphics().setScrollFactor(0).setDepth(200);                 // BOSS 血條
        this.bossTxt = this.add.text(W / 2, 18, '👹 虛空吞噬者', { fontSize: '14px', color: '#fff', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setScrollFactor(0).setDepth(201).setVisible(false);
        this.markGfx = this.add.graphics().setScrollFactor(0).setDepth(190);                 // 螢幕外 裂縫 / 信使 的方向箭頭
        this.updateUI();

        // ---------- 計時器 ----------
        this.attackTimer = this.time.addEvent({ delay: this.attackDelay, callback: this.fire, callbackScope: this, loop: true });
        this.spawnTimer = this.time.addEvent({ delay: 1500, callback: this.spawnEnemy, callbackScope: this, loop: true });
        this.time.addEvent({ delay: 12000, loop: true, callback: () => this.spawnPlanet() });
        this.time.addEvent({ delay: 8000, loop: true, callback: () => this.spawnShip() });
        this.time.addEvent({ delay: 6000, loop: true, callback: () => this.spawnSat() });
        this.time.addEvent({ delay: 15000, loop: true, callback: () => { if (Math.random() < 0.35) this.spawnNpc(); } });   // 信使：每 15 秒 35% 機率
        this.time.addEvent({ delay: RIFT_CHECK_SEC * 1000, loop: true, callback: () => this.rollRift() });                 // 裂縫：每 30 秒 20% 機率

        // ---------- 碰撞 ----------
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.bullets, this.sats, this.hitEnemy, null, this);
        this.physics.add.overlap(this.bullets, this.npcs, this.hitEnemy, null, this);
        this.physics.add.overlap(this.player, this.gems, this.collectGem, null, this);
        this.physics.add.overlap(this.player, this.enemies, (p, e) => { if (e.active) this.takeDamage(e.contact); });
        this.physics.add.overlap(this.player, this.eBullets, this.hitByShot, null, this);
        // 衛星 / 信使：與玩家只重疊、不碰撞（可直接穿過）；星球、飛船：不可攻擊，碰到受傷
        this.physics.add.overlap(this.player, this.planets, (p, o) => { if (o.active) this.takeDamage(o.dmg); });
        this.physics.add.overlap(this.player, this.ships, (p, o) => { if (o.active) this.takeDamage(o.dmg); });
        this.physics.add.overlap(this.player, this.rifts, this.enterRift, null, this);
    }

    resetJoystick() { this.touchPointer = null; this.joystickDir = { x: 0, y: 0 }; this.joyBase.setVisible(false); this.thumb.setVisible(false); }

    updateJoystick(p) {
        let dx = p.x - this.baseX, dy = p.y - this.baseY, dist = Math.hypot(dx, dy), max = 55;
        if (dist > 5) {
            let a = Math.atan2(dy, dx), c = Math.min(dist, max);
            this.thumb.setPosition(this.baseX + Math.cos(a) * c, this.baseY + Math.sin(a) * c);
            this.joystickDir = { x: Math.cos(a) * c / max, y: Math.sin(a) * c / max };
        } else { this.thumb.setPosition(this.baseX, this.baseY); this.joystickDir = { x: 0, y: 0 }; }
    }

    // ------------------------------------------------------------
    //  星球引力：回傳 (x, y) 位置受到的拉力（px/s）
    //  每顆星球各有自己的強度與範圍（由半徑決定）：越大越強、越近越強（平方衰減）
    // ------------------------------------------------------------
    pullAt(x, y) {
        const o = this._pull; o.x = 0; o.y = 0;
        this.planets.getChildren().forEach((pl) => {
            if (!pl.active) return;
            const dx = pl.x - x, dy = pl.y - y, d = Math.hypot(dx, dy) || 1;
            const k = Phaser.Math.Clamp(1 - Math.max(0, d - pl.pr) / pl.reach, 0, 1);   // 離表面越遠 k 越小，超出範圍為 0
            if (k <= 0) return;
            const f = pl.str * k * k;
            o.x += dx / d * f; o.y += dy / d * f;
        });
        return o;
    }

    // 手動瞄準：滑鼠位置換算成世界座標並算出角度
    manualAngle() {
        const pt = this.input.activePointer; pt.updateWorldPoint(this.cameras.main);
        return { a: Phaser.Math.Angle.Between(this.player.x, this.player.y, pt.worldX, pt.worldY), x: pt.worldX, y: pt.worldY };
    }

    // ------------------------------------------------------------
    //  畫血條 / 引力場 / 瞄準線 / 螢幕外箭頭 / BOSS 血條（每幀）
    // ------------------------------------------------------------
    drawBar(x, y, w, ratio, color) {
        this.hpGfx.fillStyle(0x000000, 0.7).fillRect(x - w / 2 - 1, y - 1, w + 2, 7);
        this.hpGfx.fillStyle(color, 1).fillRect(x - w / 2, y, w * Phaser.Math.Clamp(ratio, 0, 1), 5);
    }
    drawBars() {
        this.hpGfx.clear();
        let r = this.hp / this.maxHp;
        this.drawBar(this.player.x, this.player.y - 36, 46, r, r > 0.5 ? 0x44dd55 : r > 0.25 ? 0xffcc22 : 0xff3333);
        this.targets().forEach((e) => { if (e.active && !e.isBoss && e.hp < e.maxHp) this.drawBar(e.x, e.y - e.r - 12, 28, e.hp / e.maxHp, e.isNpc ? 0xffd24a : 0xff5555); });
        // 星球引力場範圍（兩圈：外圈 = 引力影響邊界）
        this.fieldGfx.clear();
        this.planets.getChildren().forEach((pl) => {
            if (!pl.active) return;
            this.fieldGfx.lineStyle(2, 0x9ad0ff, 0.14).strokeCircle(pl.x, pl.y, pl.pr + pl.reach);
            this.fieldGfx.lineStyle(2, 0x9ad0ff, 0.08).strokeCircle(pl.x, pl.y, pl.pr + pl.reach * 0.55);
        });
        // 手動瞄準指示線 + 準心
        this.aimGfx.clear();
        if (!this.isGameOver && !this.isUpgrading && this.spaceKey.isDown && this.wp.type !== 'orbit') {
            const m = this.manualAngle(), p = this.player, L = this.bulletRange * (this.wp.type === 'beam' ? 1.2 : 1), c = Math.cos(m.a), s = Math.sin(m.a);
            for (let t = 26; t < L; t += 24) this.aimGfx.lineStyle(3, this.char.color, 0.6).lineBetween(p.x + c * t, p.y + s * t, p.x + c * (t + 11), p.y + s * (t + 11));
            this.aimGfx.lineStyle(2, 0xffffff, 0.95).strokeCircle(m.x, m.y, 13)
                .lineBetween(m.x - 20, m.y, m.x - 8, m.y).lineBetween(m.x + 8, m.y, m.x + 20, m.y)
                .lineBetween(m.x, m.y - 20, m.x, m.y - 8).lineBetween(m.x, m.y + 8, m.x, m.y + 20);
        }
        this.drawMarkers();
        // BOSS 血條（固定在畫面上方中央）
        this.bossGfx.clear();
        const b = this.boss;
        if (this.bossActive && b && b.active) {
            const bw = 460, bx = W / 2 - bw / 2;
            drawPanel(this.bossGfx, bx - 6, 30, bw + 12, 22, { r: 8, a: 0.8, bw: 1, stroke: 0xff3b5b });
            this.bossGfx.fillStyle(0xff3b5b, 1).fillRoundedRect(bx, 36, bw * Phaser.Math.Clamp(b.hp / b.maxHp, 0, 1), 10, 4);
            this.bossGfx.fillStyle(0xffffff, 0.3).fillRoundedRect(bx, 36, bw * Phaser.Math.Clamp(b.hp / b.maxHp, 0, 1), 4, 2);
            this.bossTxt.setVisible(true);
        } else this.bossTxt.setVisible(false);
    }
    // 裂縫（紫）與信使（金）在螢幕外時，於螢幕邊緣畫方向箭頭
    drawMarkers() {
        const g = this.markGfx; g.clear();
        const cam = this.cameras.main, list = [];
        this.rifts.getChildren().forEach(o => { if (o.active) list.push([o, 0xb455ff]); });
        this.npcs.getChildren().forEach(o => { if (o.active) list.push([o, 0xffd24a]); });
        list.forEach(([o, col]) => {
            const sx = o.x - cam.scrollX, sy = o.y - cam.scrollY;
            if (sx > 20 && sx < W - 20 && sy > 20 && sy < H - 20) return;      // 在畫面內就不用箭頭
            const dx = sx - W / 2, dy = sy - H / 2, t = Math.min((W / 2 - 30) / Math.abs(dx || 1), (H / 2 - 30) / Math.abs(dy || 1));
            const ex = W / 2 + dx * t, ey = H / 2 + dy * t, a = Math.atan2(dy, dx);
            const pts = [{ x: ex + Math.cos(a) * 14, y: ey + Math.sin(a) * 14 }, { x: ex + Math.cos(a + 2.5) * 12, y: ey + Math.sin(a + 2.5) * 12 }, { x: ex + Math.cos(a - 2.5) * 12, y: ey + Math.sin(a - 2.5) * 12 }];
            g.fillStyle(col, 0.9).lineStyle(2, 0xffffff, 0.9); g.fillPoints(pts, true); g.strokePoints(pts, true);
        });
    }

    // 目前實際傷害（含狂暴、怒焰加成）
    dmgNow() {
        let m = 1;
        if (this.elapsed < this.frenzyUntil) m += this.frenzyDmg;                                                                   // 終焉：狂暴
        if (this.skOn && this.char.trait === 'rage' && this.hp / this.maxHp < 0.5) m += 0.08 + 0.03 * this.sl;                      // 燼火：怒焰
        return this.attackDamage * m;
    }

    // 角色技能的每幀計時（回血 / 疾風 / 星爆）
    skillTick() {
        if (!this.skOn) return;
        const t = this.char.trait, e = this.elapsed;
        if (t === 'heal' && e >= this.nextHeal) {
            this.nextHeal = e + 15000; this.hp = Math.min(this.maxHp, this.hp + this.maxHp * (0.04 + 0.012 * this.sl));
            this.popText(this.player.x, this.player.y - 44, '曙光', '#7fe3a0');
        }
        if (t === 'gale' && e >= this.nextGale) { this.nextGale = e + 8000; this.galeUntil = e + 2500; this.popText(this.player.x, this.player.y - 44, '疾風', '#66dd88'); }
        if (t === 'nova' && e >= this.nextNova) { this.nextNova = e + (10 - 0.4 * this.sl) * 1000; this.nova(200 + 8 * this.sl, this.dmgNow() * (2.5 + 0.25 * this.sl)); }
    }

    // ------------------------------------------------------------
    //  主迴圈
    // ------------------------------------------------------------
    update(time, delta) {
        let cam = this.cameras.main, dt = delta / 1000;
        this.bg.tilePositionX = cam.scrollX * 0.5; this.bg.tilePositionY = cam.scrollY * 0.5;
        this.stars.tilePositionX = cam.scrollX * 0.9; this.stars.tilePositionY = cam.scrollY * 0.9;
        this.drawBars();
        if (this.isGameOver || this.isUpgrading) { this.player.body.setVelocity(0, 0); return; }

        this.elapsed += delta;
        let sec = Math.floor(this.elapsed / 1000);
        if (sec !== this.lastSec) { this.lastSec = sec; this.cullFar(); }
        if (this.elapsed - this.lastUi > 150) { this.lastUi = this.elapsed; this.updateUI(); }
        if (this.ps.regen) this.hp = Math.min(this.maxHp, this.hp + this.ps.regen * dt);
        this.skillTick();
        let want = this.elapsed < this.frenzyUntil ? this.attackDelay * 0.75 : this.attackDelay;   // 狂暴期間攻速加快
        if (this.spaceKey.isDown) want *= 0.85;                                                    // 手動瞄準：連射更快
        if (this.attackTimer.delay !== want) this.attackTimer.delay = want;

        // --- 玩家移動（鍵盤 / 搖桿）+ 引力 ---
        let p = this.player;
        let slowed = this.elapsed < this.slowUntil;
        if (slowed) { p.setTint(0x88ccff); this.slowShown = true; }
        else if (this.slowShown) { p.clearTint(); this.slowShown = false; }
        let vx = 0, vy = 0;
        if (this.cursors.left.isDown || this.wasd.left.isDown) vx -= 1;
        if (this.cursors.right.isDown || this.wasd.right.isDown) vx += 1;
        if (this.cursors.up.isDown || this.wasd.up.isDown) vy -= 1;
        if (this.cursors.down.isDown || this.wasd.down.isDown) vy += 1;
        let mv = new Phaser.Math.Vector2(vx, vy);
        if (mv.lengthSq() > 0) mv.normalize();
        if (this.joystickDir.x !== 0 || this.joystickDir.y !== 0) mv.set(this.joystickDir.x, this.joystickDir.y);
        let spd = this.moveSpeed * (slowed ? 0.55 : 1) * (this.elapsed < this.galeUntil ? 1 + 0.2 + 0.04 * this.sl : 1);   // 疾風加成
        mv.scale(spd);
        let g0 = this.pullAt(p.x, p.y);
        p.body.setVelocity(mv.x + g0.x, mv.y + g0.y);

        // --- 環繞星位置 ---
        if (this.wp.type === 'orbit') {
            this.orbA += delta * 0.004 * (1 + 0.03 * wmetaOf(this.wp.id).rate);
            this.orbs.getChildren().forEach((o, i) => { let a = this.orbA + i * 2 * Math.PI / this.wn; o.setPosition(p.x + Math.cos(a) * this.orbR, p.y + Math.sin(a) * this.orbR); });
        }
        // --- 敵人行動 ---
        this.enemies.getChildren().forEach((e) => {
            if (!e.active) return;
            if (e.isBoss) { this.bossUpdate(e, p); return; }          // BOSS 有自己的行動邏輯（不受引力）
            let d = Phaser.Math.Distance.Between(e.x, e.y, p.x, p.y);
            if (!e.keep) this.physics.moveToObject(e, p, e.speed);     // 近戰：直線追玩家
            else {                                                      // 遠程：保持距離並射擊
                if (d > e.keep + 40) this.physics.moveToObject(e, p, e.speed);
                else if (d < e.keep - 60) this.physics.velocityFromRotation(Phaser.Math.Angle.Between(p.x, p.y, e.x, e.y), e.speed, e.body.velocity);
                else e.body.setVelocity(0, 0);
                if (this.elapsed >= e.nextShot && d < e.range) { this.enemyAttack(e); e.nextShot = this.elapsed + e.rate; }
            }
            let g = this.pullAt(e.x, e.y); e.body.velocity.x += g.x; e.body.velocity.y += g.y;   // 敵人受星球引力
        });
        // --- 信使 NPC：一直逃離玩家 ---
        this.npcs.getChildren().forEach((n) => {
            if (!n.active) return;
            if (Phaser.Math.Distance.Between(n.x, n.y, p.x, p.y) > 1300 || this.elapsed - n.born > 45000) { n.destroy(); return; }   // 逃太遠 / 停留太久就消失
            const away = Phaser.Math.Angle.Between(p.x, p.y, n.x, n.y) + Math.sin(this.elapsed / 400 + n.phase) * 0.6;   // 遠離玩家 + 左右蛇行
            this.physics.velocityFromRotation(away, n.speed, n.body.velocity);
            let g = this.pullAt(n.x, n.y); n.body.velocity.x += g.x; n.body.velocity.y += g.y;
        });
        // --- 裂縫壽命 ---
        this.rifts.getChildren().forEach((r) => {
            const age = this.elapsed - r.born;
            if (age > RIFT_LIFE) { r.destroy(); return; }
            r.setAlpha(age > RIFT_LIFE - 6000 ? (Math.floor(age / 250) % 2 ? 0.35 : 1) : 1);   // 最後 6 秒閃爍提醒
        });
        // --- 子彈：超出射程消失；飛行軌跡被星球引力彎曲 ---
        const bend = (b) => { let g = this.pullAt(b.x, b.y); b.body.velocity.x += g.x * dt * 3; b.body.velocity.y += g.y * dt * 3; };
        this.bullets.getChildren().slice().forEach((b) => {
            if (!b.active) return;
            if (Phaser.Math.Distance.Between(b.startX, b.startY, b.x, b.y) >= this.bulletRange) { b.destroy(); return; }
            bend(b);
        });
        this.eBullets.getChildren().forEach((b) => { if (b.active) bend(b); });
        // --- 經驗寶石：靠近玩家被吸附；其餘受星球引力 ---
        let mg = 120 * (this.ps.magnet || 1);
        this.gems.getChildren().forEach((g) => {
            if (!g.active) return;
            if (Phaser.Math.Distance.Between(p.x, p.y, g.x, g.y) < mg) this.physics.moveToObject(g, p, 240); else g.body.setVelocity(0, 0);
            let gp = this.pullAt(g.x, g.y); g.body.velocity.x += gp.x; g.body.velocity.y += gp.y;
        });
    }

    // ------------------------------------------------------------
    //  玩家攻擊
    // ------------------------------------------------------------
    // 在 grp（預設敵人）中找離 (x,y) 最近、且在 range 內的目標
    nearestTo(x, y, range, skip, grp) {
        let best = null, min = range;
        (grp || this.enemies).getChildren().forEach((e) => {
            if (!e.active || (skip && skip.has(e))) return;
            let d = Phaser.Math.Distance.Between(x, y, e.x, e.y);
            if (d < min) { min = d; best = e; }
        });
        return best;
    }

    fire() {
        if (this.isGameOver || this.isUpgrading) return;
        const T = this.wp.type;
        if (T === 'orbit') return;                       // 環繞星是被動碰撞，不需要開火
        let a, dmg = this.dmgNow();
        if (this.spaceKey.isDown) {                      // 手動瞄準：依滑鼠位置射擊，不需要有目標
            a = this.manualAngle().a;
        } else {                                         // 自動瞄準：優先 信使 > 敵人 > 衛星
            const px = this.player.x, py = this.player.y, rg = this.bulletRange * (T === 'beam' ? 1.2 : 1);
            let tgt = this.nearestTo(px, py, rg, null, this.npcs) || this.nearestTo(px, py, rg) || this.nearestTo(px, py, rg, null, this.sats);
            if (!tgt) return;
            a = Phaser.Math.Angle.Between(px, py, tgt.x, tgt.y);
        }
        if (T === 'beam') { this.beam(a, dmg); return; }
        let n = T === 'shot' ? this.wn : 1;              // 'shot' 類：數量 = 同時發射的子彈數（扇形排列）
        for (let i = 0; i < n; i++) this.shoot(a + (i - (n - 1) / 2) * 0.22, dmg, this.pierceCount, this.chainCount, T === 'pierce' ? 800 : this.bulletSpeed);
    }

    // 發射一顆子彈：pierce = 可再穿透幾隻，chain = 可再彈射幾次
    shoot(angle, dmg, pierce, chain, speed) {
        let b = this.add.circle(this.player.x, this.player.y, 12, this.char.color).setStrokeStyle(3, 0xffffff).setDepth(150);
        this.physics.add.existing(b); b.body.setCircle(12);
        Object.assign(b, { damage: dmg, pierce, chain, hits: new Set(), startX: b.x, startY: b.y });
        this.bullets.add(b);
        this.physics.velocityFromRotation(angle, speed, b.body.velocity);
    }

    // 光束：wn 道光束沿玩家等角度分布（1 道＝前方；2 道＝前後；4 道＝十字…）
    beam(a, dmg) {
        let L = this.bulletRange * 1.2, px = this.player.x, py = this.player.y;
        for (let k = 0; k < this.wn; k++) {
            let ang = a + k * 2 * Math.PI / this.wn;
            let dx = Math.cos(ang) * L, dy = Math.sin(ang) * L;
            this.targets().forEach((e) => {                  // 以「點到線段距離」判定命中
                if (!e.active) return;
                let t = Phaser.Math.Clamp(((e.x - px) * dx + (e.y - py) * dy) / (L * L), 0, 1);
                if (Math.hypot(e.x - (px + dx * t), e.y - (py + dy * t)) <= 16 + e.r) this.damageEnemy(e, dmg * this.wp.dmg);
            });
            let g = this.add.graphics().setDepth(160);
            g.lineStyle(16, 0xff3b6b, 0.85).lineBetween(px, py, px + dx, py + dy); g.lineStyle(5, 0xffffff, 1).lineBetween(px, py, px + dx, py + dy);
            this.tweens.add({ targets: g, alpha: 0, duration: 260, onComplete: () => g.destroy() });
        }
    }

    // 衝擊波：範圍內全部目標受傷，並清除範圍內的敵方子彈
    nova(r, dmg) {
        let p = this.player, ring = this.add.circle(p.x, p.y, r, 0xffd24a, 0.15).setStrokeStyle(4, 0xffd24a).setDepth(160);
        this.tweens.add({ targets: ring, scale: { from: 0.2, to: 1 }, alpha: 0, duration: 400, onComplete: () => ring.destroy() });
        this.targets().forEach((e) => { if (e.active && Phaser.Math.Distance.Between(p.x, p.y, e.x, e.y) < r + e.r) this.damageEnemy(e, dmg); });
        this.eBullets.getChildren().slice().forEach((b) => { if (Phaser.Math.Distance.Between(p.x, p.y, b.x, b.y) < r) b.destroy(); });
    }

    // 子彈命中：處理彈射 / 穿透 / 消失
    hitEnemy(b, e) {
        if (!b.active || !e.active || b.hits.has(e)) return;
        b.hits.add(e);
        let ex = e.x, ey = e.y;
        this.damageEnemy(e, b.damage);
        if (b.chain > 0) {                               // 彈射：轉向附近另一隻敵人
            let nx = this.nearestTo(ex, ey, 260, b.hits);
            if (nx) {
                b.chain--; b.startX = ex; b.startY = ey; b.setPosition(ex, ey);
                this.physics.velocityFromRotation(Phaser.Math.Angle.Between(ex, ey, nx.x, nx.y), this.bulletSpeed, b.body.velocity);
                return;
            }
            b.destroy(); return;
        }
        if (b.pierce > 0) { b.pierce--; return; }        // 穿透：繼續飛
        b.destroy();
    }

    // 對目標造成傷害（所有玩家傷害都經過這裡，所以暴擊在此判定）
    damageEnemy(e, dmg) {
        if (!e.active) return;
        if (Math.random() < this.critRate) {             // 暴擊
            dmg *= this.critMul;
            this.popText(e.x, e.y - e.r - 14, Math.round(dmg * 10) / 10 + '!', '#ffd24a', 14);
        }
        e.hp -= dmg;
        e.setTintFill(0xffffff);
        this.time.delayedCall(60, () => { if (e.active) e.clearTint(); });
        if (e.hp <= 0) this.killEnemy(e);
    }

    // 目標死亡：信使發放獎勵 / BOSS 觸發升級 / 一般怪掉寶石與金幣
    killEnemy(e) {
        if (e.isNpc) {                                   // 信使被打死：結算時多拿金幣或抽獎券
            if (e.carry === 'ticket') { this.npcTickets += e.tickets; this.popText(e.x, e.y - 20, `+${e.tickets} 🎟`, '#ff9ad0', 20); }
            else { this.npcCoins += e.coins; this.popText(e.x, e.y - 20, `+${e.coins} 🪙`, '#ffd24a', 20); }
            let fx = this.add.circle(e.x, e.y, 20, 0xffd24a, 0.8).setDepth(6);
            this.tweens.add({ targets: fx, scale: 3, alpha: 0, duration: 350, onComplete: () => fx.destroy() });
            e.destroy(); return;
        }
        this.kills++;
        this.coinF += e.isSat ? 1 : Math.max(1, Math.round(e.gem));      // 擊殺金幣（結算發放）
        let fx = this.add.circle(e.x, e.y, e.r, 0xffffff, 0.8).setDepth(6);
        this.tweens.add({ targets: fx, scale: 2.2, alpha: 0, duration: 250, onComplete: () => fx.destroy() });
        if (e.isBoss) { this.onBossDefeated(e); e.destroy(); return; }
        let g = this.add.circle(e.x, e.y, e.isSat ? 4 : e.gem > 1 ? 9 : 6, e.isSat ? 0xffe066 : 0x00ff88).setDepth(5);
        this.physics.add.existing(g); g.val = e.gem; this.gems.add(g);
        if (this.ps.heal) this.hp = Math.min(this.maxHp, this.hp + this.ps.heal);
        if (this.skOn && this.char.trait === 'frenzy' && ++this.frenzyKills % this.frenzyNeed === 0) this.frenzyUntil = this.elapsed + this.frenzyDur;
        e.destroy();
    }

    // ------------------------------------------------------------
    //  敵人 / 宇宙物件 / 信使 / 裂縫 的生成
    // ------------------------------------------------------------
    spawnEnemy() {
        if (this.isGameOver || this.isUpgrading || this.bossActive) return;     // BOSS 戰期間不刷小怪
        let t = this.elapsed / 1000;
        let list = Object.entries(ENEMY_TYPES).filter(([k, T]) => t >= T.unlock);   // 依時間解鎖職業
        let r = Math.random() * list.reduce((s, it) => s + it[1].w, 0), pick = list[0];
        for (const it of list) { r -= it[1].w; if (r <= 0) { pick = it; break; } }
        const [kind, T] = pick;
        let a = Math.random() * Math.PI * 2, d = Phaser.Math.Between(550, 650);   // 剛好在畫面外
        let e = this.enemies.create(this.player.x + Math.cos(a) * d, this.player.y + Math.sin(a) * d, 'e_' + kind).setDepth(10);
        let S2 = T.r * 2 + 18;
        e.body.setCircle(T.r, S2 / 2 - T.r, S2 / 2 - T.r);
        e.maxHp = e.hp = Math.max(1, Math.round(BASE_ENEMY_HP * T.hp * (1 + t / HP_GROWTH_SEC)));   // 血量隨時間成長
        let dm = 1 + t / DMG_GROWTH_SEC;                                                            // 傷害隨時間成長
        e.dmg = Math.round(T.dmg * dm); e.contact = Math.max(1, Math.round(T.contact * dm));
        Object.assign(e, { kind, r: T.r, speed: T.speed, gem: T.gem, keep: T.keep, range: T.range, rate: T.rate, bspeed: T.bspeed, color0: T.color });
        e.nextShot = this.elapsed + Phaser.Math.Between(600, T.rate || 1000);
        this.spawnTimer.delay = Math.max(350, 1500 - t * 10);                                       // 刷怪越來越快
    }

    // 可被攻擊的目標：敵人（含 BOSS）+ 衛星 + 信使
    targets() { return this.enemies.getChildren().concat(this.sats.getChildren(), this.npcs.getChildren()); }

    // 以玩家為中心、距離 d 的隨機點
    edgePoint(d) { let a = Math.random() * Math.PI * 2; return { x: this.player.x + Math.cos(a) * d, y: this.player.y + Math.sin(a) * d }; }

    // 星球：緩慢漂過；引力強度與範圍依半徑決定
    spawnPlanet() {
        if (this.isGameOver || this.isUpgrading || this.bossActive || this.elapsed < 8000 || this.planets.countActive() >= 3) return;
        let i = Phaser.Math.Between(0, PLANETS.length - 1), P = PLANETS[i], pt = this.edgePoint(800), pl = this.player;
        let o = this.planets.create(pt.x, pt.y, 'planet' + i).setDepth(3), br = P.r * 0.9;
        o.body.setCircle(br, P.T / 2 - br, P.T / 2 - br);
        o.pr = P.r; o.str = planetStrength(P.r); o.reach = planetReach(P.r);          // 半徑 / 引力強度 / 引力範圍
        o.dmg = Math.round(12 * (1 + this.elapsed / 1000 / DMG_GROWTH_SEC));
        this.physics.moveTo(o, pl.x + Phaser.Math.Between(-300, 300), pl.y + Phaser.Math.Between(-300, 300), Phaser.Math.Between(25, 45));
    }

    // 飛船：預警紅線 0.8 秒後高速掠過，需要閃躲
    spawnShip() {
        if (this.isGameOver || this.isUpgrading || this.bossActive || this.elapsed < 20000 || this.ships.countActive() >= 2) return;
        let pt = this.edgePoint(650), pl = this.player;
        let ang = Phaser.Math.Angle.Between(pt.x, pt.y, pl.x + Phaser.Math.Between(-160, 160), pl.y + Phaser.Math.Between(-160, 160));
        let warn = this.add.graphics().setDepth(2);
        warn.lineStyle(26, 0xff3333, 0.22).lineBetween(pt.x, pt.y, pt.x + Math.cos(ang) * 1500, pt.y + Math.sin(ang) * 1500);
        this.tweens.add({ targets: warn, alpha: { from: 0.3, to: 1 }, yoyo: true, repeat: 2, duration: 130 });
        this.time.delayedCall(800, () => {
            warn.destroy();
            if (this.isGameOver || this.bossActive) return;
            let o = this.ships.create(pt.x, pt.y, 'ship').setDepth(12);
            o.body.setCircle(12, 20, 20); o.setRotation(ang);
            o.dmg = Math.round(10 * (1 + this.elapsed / 1000 / DMG_GROWTH_SEC));
            this.physics.velocityFromRotation(ang, 300, o.body.velocity);
        });
    }

    // 衛星：固定不動、血量固定、不與玩家碰撞、擊毀掉 0.3 經驗、不受引力影響
    spawnSat() {
        if (this.isGameOver || this.isUpgrading || this.bossActive || this.sats.countActive() >= 4) return;
        let pt = this.edgePoint(Phaser.Math.Between(320, 560));
        let o = this.sats.create(pt.x, pt.y, 'sat').setDepth(8);
        o.body.setCircle(14, 10, 10); o.body.setVelocity(0, 0);
        Object.assign(o, { maxHp: SAT_HP, hp: SAT_HP, r: 14, gem: SAT_EXP, isSat: true });
    }

    // 信使：背著金幣或抽獎券一直逃跑；打死後結算時可多拿獎勵
    spawnNpc() {
        if (this.isGameOver || this.isUpgrading || this.bossActive || this.elapsed < 15000 || this.npcs.countActive() >= 1) return;
        const t = this.elapsed / 1000, isTicket = Math.random() < 0.3;
        const pt = this.edgePoint(Phaser.Math.Between(380, 480));
        const n = this.npcs.create(pt.x, pt.y, isTicket ? 'npc1' : 'npc0').setDepth(11);
        n.body.setCircle(14, 8, 8);
        Object.assign(n, {
            isNpc: true, r: 14, born: this.elapsed, phase: Math.random() * 6.28, speed: 150,
            maxHp: Math.round(BASE_ENEMY_HP * 1.6 * (1 + t / HP_GROWTH_SEC)), carry: isTicket ? 'ticket' : 'coin',
            coins: Math.round(40 + t * 0.6 + Phaser.Math.Between(0, 20)), tickets: 1
        });
        n.hp = n.maxHp;
        this.banner(isTicket ? '🎟 抽獎券信使出現了！快追！' : '🪙 金幣信使出現了！快追！', '#ffd24a');
    }

    // 時空裂縫：每 30 秒 20% 機率在玩家附近出現，進入後挑戰 BOSS
    rollRift() {
        if (this.isGameOver || this.isUpgrading || this.bossActive || this.rifts.countActive() > 0) return;
        if (Math.random() >= RIFT_CHANCE) return;
        const p = this.player, sx = Phaser.Math.RND.sign() * Phaser.Math.Between(180, 380), sy = Phaser.Math.Between(-190, 190);
        const r = this.rifts.create(p.x + sx, p.y + sy, 'rift').setDepth(7);
        r.body.setCircle(40, 20, 20); r.born = this.elapsed;
        this.tweens.add({ targets: r, angle: 360, duration: 3000, repeat: -1 });
        this.banner('⚠ 時空裂縫出現了！進入挑戰 BOSS', '#c98bff');
    }

    // 玩家碰到裂縫：傳送進 BOSS 戰
    enterRift(p, r) {
        if (!r.active || this.bossActive || this.isGameOver) return;
        this.bossActive = true; r.destroy();
        // 不在碰撞回呼裡直接清場（避免破壞物理迴圈），延到下一個 tick
        this.time.delayedCall(0, () => {
            [this.enemies, this.sats, this.npcs, this.planets, this.ships, this.eBullets].forEach(g => g.clear(true, true));   // 清場：只剩玩家與 BOSS
            this.cameras.main.flash(500, 150, 40, 255);
            this.bossTint.setVisible(true);
            this.banner('👹 BOSS 降臨！', '#ff5577');
            this.spawnBoss();
        });
    }

    // 生成 BOSS：血量、傷害隨時間成長
    spawnBoss() {
        const t = this.elapsed / 1000, pt = this.edgePoint(360), dm = 1 + t / DMG_GROWTH_SEC;
        const b = this.enemies.create(pt.x, pt.y, 'boss').setDepth(12);
        b.body.setCircle(52, 28, 28);
        Object.assign(b, {
            isBoss: true, r: 54, gem: 10, speed: 70, maxHp: Math.round(BASE_ENEMY_HP * BOSS_HP_MUL * (1 + t / HP_GROWTH_SEC)),
            contact: Math.round(20 * dm), bdmg: Math.max(1, Math.round(10 * dm)),
            state: 'move', atkIdx: 0, nextAtk: this.elapsed + 1800
        });
        b.hp = b.maxHp; this.boss = b;
    }

    // BOSS 行動：追擊玩家，每 2.3 秒輪流 環狀彈幕 → 扇形瞄準彈 → 預警衝刺
    bossUpdate(e, p) {
        const t = this.elapsed;
        if (e.state === 'tele') {                                   // 衝刺前的預警：停住
            e.body.setVelocity(0, 0);
            if (t >= e.dashAt) { e.state = 'dash'; e.dashEnd = t + 650; this.physics.velocityFromRotation(e.dashAng, 560, e.body.velocity); }
            return;
        }
        if (e.state === 'dash') { if (t >= e.dashEnd) { e.state = 'move'; e.body.setVelocity(0, 0); } return; }
        this.physics.moveToObject(e, p, e.speed);
        if (t >= e.nextAtk) { this.bossAttack(e, p); e.nextAtk = t + 2300; }
    }
    bossAttack(e, p) {
        const k = e.atkIdx++ % 3, a = Phaser.Math.Angle.Between(e.x, e.y, p.x, p.y);
        if (k === 0) {                                              // 環狀彈幕：14 發向四周
            const off = Math.random() * 6.28;
            for (let i = 0; i < 14; i++) this.enemyBullet(e.x, e.y, off + i * 2 * Math.PI / 14, 200, e.bdmg, 0xff5577, 8);
        } else if (k === 1) {                                       // 扇形瞄準彈：5 發朝玩家
            for (let i = -2; i <= 2; i++) this.enemyBullet(e.x, e.y, a + i * 0.22, 300, e.bdmg, 0xffaa33, 7);
        } else {                                                    // 預警衝刺：先畫紅線，0.85 秒後高速衝過去
            e.state = 'tele'; e.dashAng = a; e.dashAt = this.elapsed + 850;
            const warn = this.add.graphics().setDepth(2);
            warn.lineStyle(34, 0xff3333, 0.28).lineBetween(e.x, e.y, e.x + Math.cos(a) * 900, e.y + Math.sin(a) * 900);
            this.tweens.add({ targets: warn, alpha: { from: 0.4, to: 1 }, yoyo: true, repeat: 2, duration: 140 });
            this.time.delayedCall(850, () => warn.destroy());
        }
    }

    // BOSS 被擊敗：給金幣、回血，並一次增加 5 級（每級可選一個強化）
    onBossDefeated(e) {
        this.bossActive = false; this.boss = null; this.bossTint.setVisible(false);
        this.bossKills++;
        const c = 150 + Math.floor(this.elapsed / 1000);
        this.bossCoins += c;
        this.popText(e.x, e.y - 30, `BOSS 擊破！+${c} 🪙`, '#ffd700', 22);
        this.banner(`👹 BOSS 擊破！等級 +${BOSS_LEVELS}`, '#ffd700');
        this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.3);
        this.eBullets.clear(true, true);
        for (let i = 0; i < BOSS_LEVELS; i++) { this.level++; this.maxExp = Math.floor(this.maxExp * 1.2); }   // BOSS 升級對經驗門檻的成長較溫和（×1.2）
        this.pending += BOSS_LEVELS;
        if (!this.isUpgrading) { this.isUpgrading = true; this.time.delayedCall(0, () => this.showUpgradeMenu()); }
    }

    // 畫面上方的短暫公告
    banner(msg, color = '#fff') {
        const t = this.add.text(W / 2, 96, msg, { fontSize: '22px', color, fontStyle: 'bold', stroke: '#000', strokeThickness: 5,
            shadow: { offsetX: 0, offsetY: 3, color: '#000', blur: 8, fill: true } }).setOrigin(0.5).setScrollFactor(0).setDepth(400);
        this.tweens.add({ targets: t, y: 76, alpha: { from: 1, to: 0 }, delay: 1400, duration: 900, onComplete: () => t.destroy() });
    }

    // 清掉離玩家太遠的宇宙物件
    cullFar() {
        [this.planets, this.ships, this.sats].forEach(g => g.getChildren().slice().forEach(o => {
            if (Phaser.Math.Distance.Between(o.x, o.y, this.player.x, this.player.y) > 1600) o.destroy();
        }));
    }

    // 敵方子彈（共用）
    enemyBullet(x, y, angle, speed, dmg, color, rad, slow = false) {
        let b = this.add.circle(x, y, rad, color).setStrokeStyle(2, 0xffffff).setDepth(40);
        this.physics.add.existing(b); b.body.setCircle(rad);
        b.dmg = dmg; b.slow = slow;
        this.eBullets.add(b);
        this.physics.velocityFromRotation(angle, speed, b.body.velocity);
        this.time.delayedCall(4000, () => { if (b.active) b.destroy(); });
        return b;
    }
    // 一般敵人的攻擊：法師放延遲爆炸圈，其他射子彈
    enemyAttack(e) {
        if (e.kind === 'mage') {
            let x = this.player.x, y = this.player.y, dmg = e.dmg;
            let ring = this.add.circle(x, y, 70, 0xb066ff, 0.2).setStrokeStyle(2, 0xb066ff).setDepth(4);
            this.tweens.add({ targets: ring, alpha: 0.8, duration: 900 });
            this.time.delayedCall(900, () => {
                ring.destroy();
                let boom = this.add.circle(x, y, 70, 0xffffff, 0.6).setDepth(6);
                this.tweens.add({ targets: boom, alpha: 0, duration: 250, onComplete: () => boom.destroy() });
                if (!this.isGameOver && !this.isUpgrading && Phaser.Math.Distance.Between(this.player.x, this.player.y, x, y) < 84) this.takeDamage(dmg);
            });
            return;
        }
        let rad = e.kind === 'archer' ? 5 : e.kind === 'control' ? 9 : 7;
        this.enemyBullet(e.x, e.y, Phaser.Math.Angle.Between(e.x, e.y, this.player.x, this.player.y), e.bspeed, e.dmg, e.kind === 'control' ? 0x66ffff : e.color0, rad, e.kind === 'control');
    }

    hitByShot(p, b) {
        if (!b.active) return;
        if (b.slow && !this.isInvincible) this.slowUntil = this.elapsed + 2000;     // 控制型敵人的子彈會減速
        b.destroy(); this.takeDamage(b.dmg);
    }

    popText(x, y, msg, color = '#fff', size = 17) {
        let t = this.add.text(x, y, msg, { fontSize: size + 'px', color, fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(300);
        this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 700, onComplete: () => t.destroy() });
    }

    // ------------------------------------------------------------
    //  玩家受傷：閃避 → 防禦（固定減）→ 減傷（百分比）→ 扣血 → 反擊技能 / 重生
    // ------------------------------------------------------------
    takeDamage(amount) {
        if (this.isGameOver || this.isInvincible || this.hurtCD) return;
        if (this.dodgeChance > 0 && Math.random() < this.dodgeChance) {                   // 影行：閃避
            this.hurtCD = true; this.time.delayedCall(300, () => { this.hurtCD = false; });
            this.popText(this.player.x, this.player.y - 40, '閃避', '#b455ff'); return;
        }
        amount = Math.max(1, amount - this.defFlat);                                       // 防禦：每次受傷固定減少（至少 1）
        amount = Math.max(1, Math.round(amount * (1 - this.redPct)));                      // 減傷：再乘上百分比
        this.hp -= amount; this.hurtCD = true;
        this.cameras.main.shake(100, 0.006);
        this.player.setTintFill(0xff3333);
        this.time.delayedCall(150, () => { if (this.player.active) this.player.clearTint(); });
        this.time.delayedCall(450, () => { this.hurtCD = false; });
        if (this.hp > 0 && this.skOn && this.char.trait === 'thorn' && this.elapsed >= this.thornCd) {   // 岩盾：受傷時反擊衝擊波
            this.thornCd = this.elapsed + 4000;
            this.nova(120 + 4 * this.sl, this.dmgNow() * (1 + 0.35 * this.sl));
        }
        if (this.hp <= 0) {
            if (this.ps.revive && !this.revived) {                                         // 被動「重生」
                this.revived = true; this.hp = this.maxHp * 0.5; this.isInvincible = true;
                this.time.delayedCall(2000, () => { this.isInvincible = false; });
                this.nova(260, this.attackDamage * 4); this.popText(this.player.x, this.player.y - 40, '重生！', '#ff3b6b'); return;
            }
            this.hp = 0; this.gameOver();
        }
    }

    // 撿經驗寶石；經驗滿了就升級（可能一次升多級，累積在 pending）
    collectGem(p, g) {
        if (!g.active) return;
        this.exp += g.val; g.destroy();
        let ups = 0;
        while (this.exp >= this.maxExp) { this.exp -= this.maxExp; this.level++; this.maxExp = Math.floor(this.maxExp * 1.5); ups++; }
        if (ups) {
            this.pending += ups;
            if (!this.isUpgrading) { this.isUpgrading = true; this.time.delayedCall(0, () => this.showUpgradeMenu()); }
        }
        this.updateUI();
    }

    // ------------------------------------------------------------
    //  結算畫面：金幣明細 + 抽獎券
    // ------------------------------------------------------------
    gameOver() {
        this.isGameOver = true; this.physics.pause(); this.resetJoystick(); this.aimGfx.clear();
        const sec = this.elapsed / 1000, cx = W / 2, cy = H / 2;
        // 金幣來源：擊殺 / 存活（每 6 秒 1 枚）/ BOSS / 信使
        const cKill = Math.floor(this.coinF), cTime = Math.floor(sec / 6), cBoss = this.bossCoins, cNpc = this.npcCoins;
        const totalCoin = cKill + cTime + cBoss + cNpc;
        const tkSurvive = Math.floor(sec / 120), totalTk = tkSurvive + this.npcTickets;     // 存活每 2 分鐘送 1 張 + 信使抽獎券
        S.coins += totalCoin; S.tickets += totalTk; S.best = Math.max(S.best, sec); S.kills += this.kills; S.bossKills += this.bossKills; save();

        this.add.rectangle(cx, cy, W, H, 0x000000, 0.68).setScrollFactor(0).setDepth(900);
        panel(this, cx, cy, 640, 440, { stroke: 0xff3b3b, glow: true, fill: 0x160d16, fixed: true, d: 910, r: 18 });
        const T = (x, y, s, o, oy = 0.5) => this.add.text(x, y, s, o).setOrigin(oy, 0.5).setScrollFactor(0).setDepth(999);
        T(cx, cy - 190, 'GAME OVER', { fontSize: '38px', color: '#ff4444', fontStyle: 'bold', stroke: '#3a0000', strokeThickness: 7, shadow: { offsetX: 0, offsetY: 4, color: '#ff0000', blur: 16, fill: true } });
        const stat = this.add.graphics().setScrollFactor(0).setDepth(920);
        drawPanel(stat, cx - 290, cy - 160, 580, 38, { r: 10, fill: 0x0e1526, bw: 1, stroke: 0x3b5a96 });
        T(cx, cy - 141, `⏱ ${fmtT(sec)}　⭐ Lv ${this.level}　💀 擊殺 ${this.kills}　👹 BOSS ${this.bossKills}`, { fontSize: '16px', color: '#fff', fontStyle: 'bold' });
        // 金幣明細（左：項目，右：數量）
        const rows = [['⚔️ 擊殺金幣', `+${cKill}`], ['⏳ 存活獎勵', `+${cTime}`], ['👹 BOSS 獎勵', `+${cBoss}`], ['🎒 信使戰利品（金幣）', `+${cNpc}`], ['🎟 信使戰利品（抽獎券）', `+${this.npcTickets}`], ['🎟 存活抽獎券（每 2 分鐘）', `+${tkSurvive}`]];
        rows.forEach(([a, b], i) => {
            const y = cy - 100 + i * 28, on = b !== '+0';
            T(cx - 240, y, a, { fontSize: '15px', color: on ? '#e6eeff' : '#667794' }, 0);
            T(cx + 240, y, b, { fontSize: '15px', color: on ? '#ffd24a' : '#667794', fontStyle: 'bold' }, 1);
        });
        const line = this.add.graphics().setScrollFactor(0).setDepth(999); line.lineStyle(1, 0x3b5a96, 1).lineBetween(cx - 240, cy + 72, cx + 240, cy + 72);
        T(cx, cy + 98, `合計　🪙 +${totalCoin}　　🎟 +${totalTk}`, { fontSize: '22px', color: '#ffd700', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 });
        const o = { d: 950, fixed: true, delay: 500, w: 170 };
        btn(this, cx - 190, cy + 165, '再來一次', () => this.scene.restart(this.cfg), '#2a7de1', 20, o);
        btn(this, cx, cy + 165, '去養成', () => this.scene.start('UpgradeScene'), '#d08a2a', 20, o);
        btn(this, cx + 190, cy + 165, '回主頁', () => this.scene.start('MenuScene'), '#444a5a', 20, o);
    }

    // ------------------------------------------------------------
    //  升級選單（局內）：橫向三張卡片；pending > 0 時會連續出現
    // ------------------------------------------------------------
    showUpgradeMenu() {
        if (this.isGameOver) { this.isUpgrading = false; return; }
        this.physics.pause(); this.resetJoystick(); this.player.body.setVelocity(0, 0); this.aimGfx.clear();
        const pool = [
            { ic: '⚡', name: '移動速度', desc: '+20', fn: () => { this.moveSpeed += 20; } },
            { ic: '⚔️', name: '傷害', desc: '+1', fn: () => { this.attackDamage += 1; } },
            { ic: '🔫', name: '攻擊速度', desc: '+15%', fn: () => { this.attackDelay = Math.max(200, this.attackDelay * 0.85); } },
            { ic: '🎯', name: '射程', desc: '+80', fn: () => { this.bulletRange += 80; } },
            { ic: '❤️', name: '最大血量', desc: '+20，並回復 20', fn: () => { this.maxHp += 20; this.hp = Math.min(this.maxHp, this.hp + 20); } },
            { ic: '🩹', name: '緊急治療', desc: '回復 40% 最大血量', fn: () => { this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.4); } }
        ];
        const options = Phaser.Utils.Array.Shuffle(pool).slice(0, 3);
        const cw = 270, ch = 200, cy = 290;
        let ui = [
            this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.78).setScrollFactor(0).setDepth(300),
            panel(this, W / 2, 110, 460, 56, { stroke: 0xffd700, glow: true, fixed: true, d: 301 }),
            this.add.text(W / 2, 110, `🎉 等級提升！ Lv ${this.level}`, { fontSize: '24px', color: '#ffd700', fontStyle: 'bold', stroke: '#5a3b00', strokeThickness: 4 }).setOrigin(0.5).setScrollFactor(0).setDepth(302),
            this.add.text(W / 2, 158, this.pending > 1 ? `請選擇一個強化（還有 ${this.pending - 1} 次選擇）` : '請選擇一個強化', { fontSize: '14px', color: '#9bb4ee' }).setOrigin(0.5).setScrollFactor(0).setDepth(302)
        ];
        let chosen = false;
        options.forEach((o, i) => {
            const cx = W / 2 + (i - 1) * 295;
            let g = this.add.graphics().setScrollFactor(0).setDepth(301);
            const paint = (hv) => {
                g.clear();
                drawPanel(g, cx - cw / 2, cy - ch / 2, cw, ch, { fill: hv ? 0x24396a : 0x182647, stroke: hv ? 0xffd700 : 0x00aaff, glow: hv, a: 0.97 });
                g.fillStyle(0x0b1226, 1).fillCircle(cx, cy - 45, 36).lineStyle(2, hv ? 0xffd700 : 0x00aaff, 1).strokeCircle(cx, cy - 45, 36);
            };
            paint(false);
            let ic = this.add.text(cx, cy - 45, o.ic, { fontSize: '36px' }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
            let nm = this.add.text(cx, cy + 20, o.name, { fontSize: '21px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
            let ds = this.add.text(cx, cy + 56, o.desc, { fontSize: '16px', color: '#7fe3a0', fontStyle: 'bold', align: 'center', wordWrap: { width: cw - 30 } }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
            let z = this.add.zone(cx, cy, cw, ch).setScrollFactor(0).setDepth(303).setInteractive({ useHandCursor: true });
            z.on('pointerover', () => paint(true)).on('pointerout', () => paint(false));
            z.on('pointerdown', () => {
                if (chosen) return;
                chosen = true; o.fn(); ui.forEach(el => el.destroy());
                this.pending--;
                this.updateUI();
                if (this.pending > 0) this.time.delayedCall(120, () => this.showUpgradeMenu());    // 還有待選的升級：再開一次
                else { this.physics.resume(); this.time.delayedCall(150, () => { this.isUpgrading = false; }); }
            });
            ui.push(g, ic, nm, ds, z);
        });
    }

    // HUD：左上資訊面板 + 頂端經驗條
    updateUI() {
        const t = this.elapsed / 1000, manual = this.spaceKey && this.spaceKey.isDown;
        const coinNow = Math.floor(this.coinF) + this.bossCoins + this.npcCoins;
        this.uiText.setText(
            `⭐ Lv ${this.level}　⏱ ${fmtT(t)}　💀 ${this.kills}　🪙 ${coinNow}\n` +
            `❤️ ${Math.ceil(Math.max(0, this.hp))}/${this.maxHp}　⚔️ ${this.attackDamage.toFixed(1)}　👟 ${this.moveSpeed}　🎯 ${this.bulletRange}\n` +
            `👾 敵人強度　血量 ×${(1 + t / HP_GROWTH_SEC).toFixed(1)}　傷害 ×${(1 + t / DMG_GROWTH_SEC).toFixed(1)}` +
            (this.excl ? '\n✦ 專武啟動' : '') + (this.elapsed < this.frenzyUntil ? '\n🔥 狂暴中' : '') + (this.elapsed < this.galeUntil ? '\n🍃 疾風中' : '') +
            (manual && this.wp.type !== 'orbit' ? '\n🎯 手動瞄準（連射）' : '')
        );
        this.hudBg.clear();
        drawPanel(this.hudBg, 12, 20, this.uiText.width + 24, this.uiText.height + 16, { r: 10, a: 0.74, bw: 1, stroke: 0x3b5a96 });
        const ratio = Math.min(1, this.exp / this.maxExp);
        this.expGfx.clear().fillStyle(0x000000, 0.6).fillRect(0, 0, W, 10).fillStyle(0x00ff88, 1).fillRect(0, 0, W * ratio, 10)
            .fillStyle(0xffffff, 0.3).fillRect(0, 0, W * ratio, 4).lineStyle(1, 0x00ff88, 0.5).lineBetween(0, 10, W, 10);
    }
}

// ============================================================
//  啟動遊戲：固定 960×540 橫向解析度，FIT 等比縮放並置中
// ============================================================
const game = new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#000',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: [MenuScene, LoadoutScene, UpgradeScene, GachaScene, CodexScene, GameScene]
});

// ============================================================
//  強制橫向：直向時蓋上提示並暫停遊戲，轉回橫向後自動繼續
// ============================================================
(function () {
    const rot = document.getElementById('rot');
    let asleep = false;
    function check() {
        const portrait = window.innerHeight > window.innerWidth;
        rot.style.display = portrait ? 'flex' : 'none';
        if (portrait && !asleep) { asleep = true; game.loop.sleep(); }
        else if (!portrait && asleep) { asleep = false; game.loop.wake(); }
    }
    window.addEventListener('resize', check);
    window.addEventListener('orientationchange', () => setTimeout(check, 200));
    check();
    // 支援的瀏覽器（通常需要全螢幕）嘗試鎖定橫向；失敗就靠上面的提示畫面
    window.addEventListener('pointerdown', function once() {
        window.removeEventListener('pointerdown', once);
        try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
    });
})();
