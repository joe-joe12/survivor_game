<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶可夢倖存者</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
    </style>
</head>
<body>
<div id="canvas-container"></div>

<script>
class GameScene extends Phaser.Scene {
    constructor() {
        super('GameScene');
        this.exp = 0;
        this.maxExp = 5;
        this.level = 1;
        this.moveSpeed = 180;
        this.attackDamage = 1;
        this.attackDelay = 800;
        this.mapSize = 2000;
        
        this.isUpgrading = false;
        this.joystickDir = { x: 0, y: 0 };
        this.activeTouchId = null;
    }

    create() {
        this.physics.world.setBounds(0, 0, this.mapSize, this.mapSize);

        // 背景棋盤與紅框
        let bgGraphics = this.add.graphics();
        let gridSize = 80;
        bgGraphics.lineStyle(1, 0x333333, 0.8);
        for (let x = 0; x <= this.mapSize; x += gridSize) {
            bgGraphics.moveTo(x, 0);
            bgGraphics.lineTo(x, this.mapSize);
        }
        for (let y = 0; y <= this.mapSize; y += gridSize) {
            bgGraphics.moveTo(0, y);
            bgGraphics.lineTo(this.mapSize, y);
        }
        bgGraphics.strokePath();
        
        bgGraphics.lineStyle(6, 0xff2222, 1);
        bgGraphics.strokeRect(0, 0, this.mapSize, this.mapSize);

        // 玩家
        this.player = this.add.circle(this.mapSize / 2, this.mapSize / 2, 15, 0x00aaff);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);

        // 攝影機
        this.cameras.main.setBounds(0, 0, this.mapSize, this.mapSize);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        // 鍵盤支援 (WASD + 方向鍵)
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // 固定 UI 搖桿 (左下角)
        this.baseX = 100;
        this.baseY = window.innerHeight - 100;
        this.joystickBase = this.add.circle(this.baseX, this.baseY, 50, 0xffffff, 0.25).setScrollFactor(0).setDepth(100);
        this.joystickThumb = this.add.circle(this.baseX, this.baseY, 25, 0xffffff, 0.65).setScrollFactor(0).setDepth(101);

        // 初始化全域防卡死監聽
        this.setupNativeTouch();

        // 物件組
        this.enemies = this.physics.add.group();
        this.bullets = this.physics.add.group();
        this.gems = this.physics.add.group();

        // UI
        this.uiText = this.add.text(16, 16, `等級: ${this.level} | 經驗: ${this.exp}/${this.maxExp}\n傷害: ${this.attackDamage} | 速度: ${this.moveSpeed}`, {
            fontSize: '16px',
            color: '#ffffff',
            backgroundColor: '#00000088',
            padding: { x: 10, y: 5 }
        }).setScrollFactor(0).setDepth(200);

        // 計時器
        this.attackTimer = this.time.addEvent({ delay: this.attackDelay, callback: this.autoAttack, callbackScope: this, loop: true });
        this.time.addEvent({ delay: 1000, callback: this.spawnEnemy, callbackScope: this, loop: true });

        // 碰撞
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.player, this.gems, this.collectGem, null, this);
    }

    setupNativeTouch() {
        const resetJoystick = () => {
            this.activeTouchId = null;
            this.joystickDir = { x: 0, y: 0 };
            this.joystickThumb.setPosition(this.baseX, this.baseY);
            if (this.player && this.player.body) {
                this.player.body.setVelocity(0, 0);
            }
        };

        window.addEventListener('touchstart', (e) => {
            if (this.isUpgrading) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.clientX < window.innerWidth / 2 && this.activeTouchId === null) {
                    this.activeTouchId = t.identifier;
                    this.updateJoystickPos(t.clientX, t.clientY);
                    break;
                }
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (this.isUpgrading || this.activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === this.activeTouchId) {
                    this.updateJoystickPos(t.clientX, t.clientY);
                    break;
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === this.activeTouchId) {
                    resetJoystick();
                    break;
                }
            }
        }, { passive: true });

        window.addEventListener('touchcancel', resetJoystick, { passive: true });
        window.addEventListener('blur', resetJoystick);
    }

    updateJoystickPos(clientX, clientY) {
        let dx = clientX - this.baseX;
        let dy = clientY - this.baseY;
        let dist = Math.hypot(dx, dy);
        let maxDist = 50;

        if (dist > 0) {
            let angle = Math.atan2(dy, dx);
            let clampDist = Math.min(dist, maxDist);

            this.joystickThumb.setPosition(
                this.baseX + Math.cos(angle) * clampDist,
                this.baseY + Math.sin(angle) * clampDist
            );

            // 加上 Safe Guard 避免出現 NaN
            let dirX = Math.cos(angle) * (clampDist / maxDist);
            let dirY = Math.sin(angle) * (clampDist / maxDist);
            this.joystickDir = {
                x: isNaN(dirX) ? 0 : dirX,
                y: isNaN(dirY) ? 0 : dirY
            };
        } else {
            this.joystickDir = { x: 0, y: 0 };
        }
    }

    update() {
        if (this.isUpgrading) {
            this.player.body.setVelocity(0, 0);
            return;
        }

        let vx = 0, vy = 0;

        // 1. 鍵盤輸入
        if (this.cursors.left.isDown || this.wasd.left.isDown) vx = -1;
        if (this.cursors.right.isDown || this.wasd.right.isDown) vx = 1;
        if (this.cursors.up.isDown || this.wasd.up.isDown) vy = -1;
        if (this.cursors.down.isDown || this.wasd.down.isDown) vy = 1;

        // 2. 手機搖桿輸入
        if (this.joystickDir.x !== 0 || this.joystickDir.y !== 0) {
            vx = this.joystickDir.x;
            vy = this.joystickDir.y;
        }

        let vec = new Phaser.Math.Vector2(vx, vy);
        if (this.joystickDir.x === 0 && this.joystickDir.y === 0 && (vx !== 0 || vy !== 0)) {
            vec.normalize();
        }
        vec.scale(this.moveSpeed);
        
        this.player.body.setVelocity(vec.x, vec.y);

        // 寶石磁鐵
        this.gems.getChildren().forEach(gem => {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, gem.x, gem.y);
            if (dist < 120) {
                this.physics.moveToObject(gem, this.player, 220);
            }
        });
    }

    autoAttack() {
        if (this.isUpgrading) return;
        let nearestEnemy = null;
        let minDistance = 400;

        this.enemies.getChildren().forEach(enemy => {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
            if (dist < minDistance) {
                minDistance = dist;
                nearestEnemy = enemy;
            }
        });

        if (nearestEnemy) {
            let bullet = this.add.circle(this.player.x, this.player.y, 5, 0xffff00);
            this.physics.add.existing(bullet);
            bullet.damage = this.attackDamage;
            this.bullets.add(bullet);

            let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, nearestEnemy.x, nearestEnemy.y);
            this.physics.velocityFromRotation(angle, 500, bullet.body);
            this.time.delayedCall(2000, () => bullet.destroy());
        }
    }

    spawnEnemy() {
        if (this.isUpgrading) return;
        let angle = Math.random() * Math.PI * 2;
        let spawnDist = 450;
        let x = Phaser.Math.Clamp(this.player.x + Math.cos(angle) * spawnDist, 50, this.mapSize - 50);
        let y = Phaser.Math.Clamp(this.player.y + Math.sin(angle) * spawnDist, 50, this.mapSize - 50);

        let enemy = this.add.circle(x, y, 12, 0xff4444);
        this.physics.add.existing(enemy);
        enemy.hp = 1;
        this.enemies.add(enemy);

        this.physics.moveToObject(enemy, this.player, 80);
    }

    hitEnemy(bullet, enemy) {
        enemy.hp -= bullet.damage;
        bullet.destroy();

        if (enemy.hp <= 0) {
            let gem = this.add.circle(enemy.x, enemy.y, 6, 0x00ff88);
            this.physics.add.existing(gem);
            this.gems.add(gem);
            enemy.destroy();
        }
    }

    collectGem(player, gem) {
        gem.destroy();
        this.exp += 1;

        if (this.exp >= this.maxExp) {
            this.level += 1;
            this.exp = 0;
            this.maxExp = Math.floor(this.maxExp * 1.5);
            this.showUpgradeMenu();
        }

        this.updateUI();
    }

    showUpgradeMenu() {
        this.isUpgrading = true;
        this.physics.pause();
        this.activeTouchId = null;
        this.joystickDir = { x: 0, y: 0 };
        this.joystickThumb.setPosition(this.baseX, this.baseY);
        this.player.body.setVelocity(0, 0);

        let overlay = this.add.rectangle(0, 0, this.cameras.main.width * 2, this.cameras.main.height * 2, 0x000000, 0.75)
            .setScrollFactor(0).setDepth(300);

        let titleText = this.add.text(this.cameras.main.width / 2, 100, '🎉 等級提升！請選擇一個強化：', {
            fontSize: '18px', color: '#ffd700', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(301);

        let options = [
            { text: '⚡ 增加移動速度 (+25)', action: () => { this.moveSpeed += 25; } },
            { text: '⚔️ 增加子彈傷害 (+1)', action: () => { this.attackDamage += 1; } },
            { text: '🔫 增加攻擊速度 (-15% 間隔)', action: () => { 
                this.attackDelay = Math.max(200, this.attackDelay * 0.85); 
                this.attackTimer.reset({ delay: this.attackDelay, callback: this.autoAttack, callbackScope: this, loop: true });
            } }
        ];

        let uiElements = [overlay, titleText];

        options.forEach((opt, index) => {
            let y = 180 + index * 70;
            let btnBg = this.add.rectangle(this.cameras.main.width / 2, y, 280, 50, 0x222244, 0.95)
                .setStrokeStyle(2, 0x00aaff)
                .setInteractive()
                .setScrollFactor(0)
                .setDepth(301);

            let btnText = this.add.text(this.cameras.main.width / 2, y, opt.text, {
                fontSize: '15px', color: '#ffffff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(302);

            btnBg.on('pointerdown', () => {
                opt.action();
                uiElements.forEach(el => el.destroy());
                this.updateUI();
                this.physics.resume();
                this.isUpgrading = false;
            });

            uiElements.push(btnBg, btnText);
        });
    }

    updateUI() {
        this.uiText.setText(`等級: ${this.level} | 經驗: ${this.exp}/${this.maxExp}\n傷害: ${this.attackDamage} | 速度: ${this.moveSpeed}`);
    }
}

const config = {
    type: Phaser.AUTO,
    parent: 'canvas-container',
    width: window.innerWidth,
    height: window.innerHeight,
    scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: GameScene
};

new Phaser.Game(config);
</script>
</body>
</html>
