<style>

html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; touch-action: none; }

       font: 12px monospace; padding: 6px 10px; display: none; white-space: pre-wrap; max-height: 40vh; overflow: auto; }

#rot { position: fixed; inset: 0; z-index: 10000; background: #05070f; color: #cfe0ff; display: none;
       flex-direction: column; align-items: center; justify-content: center; gap: 18px;
       font: bold 22px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; text-align: center; padding: 20px; }

<body>

<div id="rot"><div class="ic">📱</div><div>請將裝置轉為橫向後再遊玩</div><div style="font-size:14px;color:#7f93b8;font-weight:normal">（電腦請把瀏覽器視窗拉成寬大於高）</div></div>
<script>
// 錯誤顯示：把執行期錯誤印在畫面底部，方便在手機上除錯
(function () {
    const box = document.getElementById('err');
    const show = (m) => { box.style.display = 'block'; box.textContent += m + '\n'; };
    window.addEventListener('error', (e) => show('Error: ' + e.message + ' @' + e.lineno));
    window.addEventListener('unhandledrejection', (e) => show('Promise: ' + e.reason));
})();

// ============================================================

// ============================================================

(function () {
    const proto = Phaser.GameObjects.GameObjectFactory.prototype, _text = proto.text;
    proto.text = function (x, y, t, st) { return _text.call(this, x, y, t, Object.assign({ fontFamily: FONT }, st)); };
})();

const BASE_ENEMY_HP = 5;         // 小怪基礎血量
const HP_GROWTH_SEC = 75;        // 敵人血量每過 N 秒 +100%
const DMG_GROWTH_SEC = 150;      // 敵人傷害每過 N 秒 +100%
const GRAV = 85;                 // 星球引力基準（半徑 90 的星球表面處拉力，px/s）
const RIFT_CHECK_SEC = 30;       // 每隔幾秒判定一次是否出現裂縫
const RIFT_CHANCE = 0.2;         // 每次判定出現裂縫的機率（20%）
const RIFT_LIFE = 30000;         // 裂縫存在時間（毫秒）
const BOSS_HP_MUL = 15;          // BOSS 血量 = 小怪基礎血量 × 此倍率 × 時間成長
const BOSS_LEVELS = 5;           // 擊敗 BOSS 增加的等級數
const SELL_PRICE = [20, 60, 180, 450, 1200];   // 重複的項目賣掉可得金幣（依稀有度）

// 稀有度：w = 抽中權重（保底：連續 29 次沒出史詩以上，第 30 抽必出史詩以上）

// ------------------------------------------------------------
const CHARACTERS = [
    { name: '曉光', r: 0, color: 0x4fd1ff, sides: 6, rot: -Math.PI / 2, ey: 0, hp: 100, speed: 180, dmg: 1.0, delay: 800, range: 450, desc: '均衡型，沒有短板',

// ------------------------------------------------------------

//     kind 'chain'  → 增加彈射次數
// ------------------------------------------------------------
const WEAPONS = [
    { name: '基礎彈', r: 0, ic: '🔹', type: 'shot',   n: 1, dmg: 1.0, delay: 1.0, excl: 0, desc: '單發，鎖定最近敵人',

    { name: '散射彈', r: 0, ic: '✴️', type: 'shot',   n: 3, dmg: 0.5, delay: 1.1, excl: 1, desc: '三發扇形散射',
      spec: { kind: 'count', name: '散彈增加', max: 4, cost: 70, txt: l => `散彈 +${l} 發（共 ${3 + l} 發）` } },
    { name: '雙發彈', r: 1, ic: '🔸', type: 'shot',   n: 2, dmg: 0.7, delay: 1.0, excl: 2, desc: '兩發並列',
      spec: { kind: 'count', name: '追加彈', max: 3, cost: 70, txt: l => `並列 +${l} 發（共 ${2 + l} 發）` } },
    { name: '穿透箭', r: 1, ic: '🏹', type: 'pierce', n: 2, dmg: 0.9, delay: 1.1, excl: 3, desc: '高速，可穿透 2 隻敵人',
      spec: { kind: 'pierce', name: '穿透數', max: 4, cost: 70, txt: l => `穿透 +${l} 隻（共 ${2 + l} 隻）` } },
    { name: '彈射珠', r: 2, ic: '🔮', type: 'chain',  n: 2, dmg: 0.9, delay: 1.0, excl: 4, desc: '命中後彈射到附近敵人 2 次',
      spec: { kind: 'chain', name: '彈射次數', max: 4, cost: 80, txt: l => `彈射 +${l} 次（共 ${2 + l} 次）` } },
    { name: '環繞星', r: 3, ic: '🌟', type: 'orbit',  n: 2, dmg: 0.7, delay: 1.0, excl: 5, desc: '2 顆星環繞身邊，碰到敵人就傷害',

// 被動：只能裝備一個
const PASSIVES = [
    { name: '鋼鐵意志', r: 0, ic: '🛡️', hpMul: 1.12, desc: '最大血量 +12%' },
    { name: '輕靈', r: 0, ic: '👟', spdMul: 1.08, desc: '移動速度 +8%' },
    { name: '磁力', r: 1, ic: '🧲', magnet: 1.8, desc: '寶石吸附範圍 +80%' },
    { name: '銳利', r: 1, ic: '🎯', dmgMul: 1.1, desc: '傷害 +10%' },
    { name: '連擊', r: 2, ic: '⚡', atkMul: 0.88, desc: '攻擊間隔 -12%' },
    { name: '回春', r: 2, ic: '🌿', regen: 0.6, desc: '每秒回復 0.6 血量' },
    { name: '嗜血', r: 3, ic: '🩸', heal: 0.5, desc: '每擊殺回復 0.5 血量' },
    { name: '重生', r: 4, ic: '♻️', revive: true, desc: '陣亡時復活一次（50% 血量、衝擊波、2 秒無敵）' }
];
[CHARACTERS, WEAPONS, PASSIVES].forEach(L => L.forEach((it, i) => { it.id = i; }));
const CATS = [
    { key: 'c', u: 'uc', list: CHARACTERS, label: '角色', icon: null },
    { key: 'w', u: 'uw', list: WEAPONS, label: '武器' },
    { key: 'p', u: 'up', list: PASSIVES, label: '被動' }
];
const TOTAL = CHARACTERS.length + WEAPONS.length + PASSIVES.length;
const MILESTONES = [{ n: 4, t: 1 }, { n: 8, t: 1 }, { n: 12, t: 2 }, { n: 16, t: 2 }, { n: 20, t: 3 }, { n: TOTAL, t: 5 }];

// ------------------------------------------------------------
//  局外成長：養成項目定義
//  cost = 第 1 級的基礎花費；第 n 級花費 = cost × (1 + 0.8 × 已有等級)
// ------------------------------------------------------------
const CSTATS = [   // 每個角色獨立計算的能力
    { k: 'atk',  name: '攻擊',     ic: '⚔️', max: 20, cost: 40, txt: l => `傷害 +${l * 5}%` },
    { k: 'def',  name: '防禦',     ic: '🛡️', max: 15, cost: 50, txt: l => `每次受傷 -${(l * 0.4).toFixed(1)} 點（至少 1）` },
    { k: 'red',  name: '減傷',     ic: '💠', max: 20, cost: 60, txt: l => `受到傷害 -${(l * 1.5).toFixed(1)}%` },
    { k: 'spd',  name: '移速',     ic: '👟', max: 15, cost: 35, txt: l => `移動速度 +${l * 2}%` },
    { k: 'crit', name: '暴擊機率', ic: '🎯', max: 25, cost: 45, txt: l => `暴擊率 ${5 + l * 2}%` },
    { k: 'cdmg', name: '暴擊傷害', ic: '💥', max: 20, cost: 45, txt: l => `暴擊傷害 ${150 + l * 5}%` }
];
const SKILL_MAX = 10, SKILL_COST = 120;          // 角色技能等級上限 / 基礎花費
const WSTATS = [   // 每把武器獨立計算的通用能力（另外還有 WEAPONS[].spec 專屬項目）
    { k: 'rate',  name: '射速',     ic: '🔫', max: 12, cost: 45, txt: l => `攻擊間隔 -${Math.round((1 - 1 / (1 + 0.05 * l)) * 100)}%` },
    { k: 'range', name: '射擊範圍', ic: '📏', max: 10, cost: 40, txt: l => `射程 +${l * 5}%` }
];
const upCost = (base, lv) => Math.round(base * (1 + lv * 0.8));      // 從 lv 升到 lv+1 要花多少
const refundOf = (base, lv) => Math.floor(upCost(base, lv - 1) * 0.5); // 從 lv 降回 lv-1 退還 50%

// 敵人六大職業（血量、傷害會隨時間成長）
const ENEMY_TYPES = {
    melee:   { color: 0xff4455, r: 12, hp: 1.0, speed: 80, dmg: 8,  contact: 8,  gem: 1, unlock: 0,  w: 6 },
    tank:    { color: 0x6a7a99, r: 20, hp: 3.5, speed: 42, dmg: 14, contact: 14, gem: 3, unlock: 20, w: 2 },
    ranged:  { color: 0xff9933, r: 12, hp: 0.8, speed: 65, dmg: 6,  contact: 4, keep: 280, range: 380, rate: 1800, bspeed: 220, gem: 1, unlock: 30, w: 3 },
    archer:  { color: 0xc8e63c, r: 11, hp: 0.6, speed: 70, dmg: 11, contact: 4, keep: 380, range: 430, rate: 3200, bspeed: 430, gem: 2, unlock: 45, w: 2 },
    mage:    { color: 0xb066ff, r: 13, hp: 0.9, speed: 55, dmg: 14, contact: 4, keep: 330, range: 380, rate: 3600, gem: 2, unlock: 60, w: 2 },
    control: { color: 0x44e0e0, r: 12, hp: 0.9, speed: 60, dmg: 3,  contact: 3, keep: 300, range: 380, rate: 2800, bspeed: 170, gem: 2, unlock: 75, w: 2 }
};

// ============================================================
//  存檔（localStorage）
// ============================================================
const SKEY = 'void_survivors_v2';    // v2：加入金幣、養成、自動賣出設定（舊存檔不相容，所以換了 key）
function loadSave() {
    let d = {
        tickets: START_TICKETS, coins: START_COINS, dust: 0, pity: 0,
        uc: [0], uw: [0], up: [],                      // 已擁有的 角色 / 武器 / 被動
        sel: { c: 0, w: 0, p: -1 },                    // 目前裝備
        claimed: [], best: 0, kills: 0, bossKills: 0,
        star: { c: {}, w: {}, p: {} },                 // 升星
        meta: {},                                      // 角色養成：{ 角色id: {atk, def, red, spd, crit, cdmg, skill} }
        wmeta: {},                                     // 武器養成：{ 武器id: {rate, range, spec} }
        auto: [false, false, false, false, false]      // 各稀有度「重複直接賣掉」開關
    };
    try { let s = JSON.parse(localStorage.getItem(SKEY)); if (s) d = Object.assign(d, s); } catch (e) {}
    return d;
}
let S = loadSave();
function save() {
    S._t = Date.now();
    try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {}
    if (window.Cloud) Cloud.queue();
}
// 取得（必要時建立）某角色 / 武器的養成資料
const metaOf = (id) => S.meta[id] || (S.meta[id] = { atk: 0, def: 0, red: 0, spd: 0, crit: 0, cdmg: 0, skill: 0 });
const wmetaOf = (id) => S.wmeta[id] || (S.wmeta[id] = { rate: 0, range: 0, spec: 0 });

// 圖鑑收集里程碑獎勵（送抽獎券）
function checkMilestones() {
    let tot = S.uc.length + S.uw.length + S.up.length, got = [];
    MILESTONES.forEach(m => { if (tot >= m.n && !S.claimed.includes(m.n)) { S.claimed.push(m.n); S.tickets += m.t; got.push(m); } });
    return got;
}
// 抽稀有度（含 30 抽保底；minR 用於十連保底）
function rollRarity(minR = 0) {
    let pool = (S.pity >= 29 ? [2, 3, 4] : [0, 1, 2, 3, 4]).filter(i => i >= minR);
    let x = Math.random() * pool.reduce((a, i) => a + RAR[i].w, 0);
    for (const i of pool) { x -= RAR[i].w; if (x <= 0) return i; }
    return pool[0];
}

const MAXSTAR = 5;
const STAR_TXT = { c: '血量+5%、傷害+4%', w: '傷害+5%', p: '效果+20%' };
const starOf = (k, id) => (S.star[k] && S.star[k][id]) || 0;
const starStr = (k, id) => '★'.repeat(starOf(k, id));
function scalePassive(p, st) {            // 被動升星：每星效果 +20%
    let k = 1 + 0.2 * st, o = Object.assign({}, p);
    ['hpMul', 'spdMul', 'dmgMul', 'magnet'].forEach(f => { if (o[f]) o[f] = 1 + (o[f] - 1) * k; });
    if (o.atkMul) o.atkMul = Math.max(0.6, 1 - (1 - o.atkMul) * k);
    ['regen', 'heal'].forEach(f => { if (o[f]) o[f] *= k; });
    return o;
}

// ------------------------------------------------------------
//  宇宙物件
//  星球：緩慢漂過，碰到受傷，不可攻擊，有引力（引力強度與範圍都隨半徑 r 改變：越大越強、範圍越廣）
//  飛船：預警後高速掠過，碰到受傷，不可攻擊
//  衛星：固定不動、可攻擊、血量固定、可直接穿過、不受引力
// ------------------------------------------------------------
const PLANETS = [{ T: 130, r: 60, c: 0xc0603a }, { T: 250, r: 90, c: 0x3a7ac0, ring: true }, { T: 240, r: 120, c: 0x8a5ac0 }];
// 依半徑計算引力：強度 ∝ (r/90)^1.5（大星球強很多），影響範圍 = 160 + 2r（從星球表面往外算）
const planetStrength = (r) => GRAV * Math.pow(r / 90, 1.5);
const planetReach = (r) => 160 + r * 2;
const SAT_HP = 4;       // 衛星血量（固定，不隨時間成長）
const SAT_EXP = 0.3;    // 衛星經驗 = 一般怪物（1）的 0.3 倍

// ============================================================
//  模型 / 背景繪製（全部用 Graphics 動態產生貼圖，不需要外部圖片）
// ============================================================
function poly(g, cx, cy, r, n, rot) {      // 正多邊形
    let pts = [];
    for (let i = 0; i < n; i++) { let a = rot + i * 2 * Math.PI / n; pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }); }
    g.fillPoints(pts, true); g.strokePoints(pts, true);
}
function eyes(g, cx, cy, gap, r) {         // 一對眼睛
    g.fillStyle(0xffffff, 1).fillCircle(cx - gap, cy, r).fillCircle(cx + gap, cy, r);
    g.fillStyle(0x111111, 1).fillCircle(cx - gap + 1, cy, r * 0.5).fillCircle(cx + gap + 1, cy, r * 0.5);
}
const ENEMY_DRAW = {
    melee(g, cx, cy, r) {
        for (let i = 0; i < 8; i++) { let a = i * Math.PI / 4;
            g.fillTriangle(cx + Math.cos(a - 0.3) * r * 0.9, cy + Math.sin(a - 0.3) * r * 0.9, cx + Math.cos(a) * (r + 6), cy + Math.sin(a) * (r + 6), cx + Math.cos(a + 0.3) * r * 0.9, cy + Math.sin(a + 0.3) * r * 0.9); }
        g.fillCircle(cx, cy, r); g.strokeCircle(cx, cy, r); eyes(g, cx, cy, r * 0.4, r * 0.3);
        g.lineStyle(2, 0x111111, 1).lineBetween(cx - r * 0.7, cy - r * 0.55, cx - r * 0.1, cy - r * 0.25).lineBetween(cx + r * 0.7, cy - r * 0.55, cx + r * 0.1, cy - r * 0.25);
    },
    tank(g, cx, cy, r) {
        g.lineStyle(4, 0x222a3a, 1); poly(g, cx, cy, r + 2, 6, 0);
        g.lineStyle(3, 0x333b4d, 1).lineBetween(cx - r, cy, cx + r, cy).lineBetween(cx, cy - r, cx, cy + r);
        g.fillStyle(0xffdd44, 1).fillRect(cx - 8, cy - 3, 16, 5);
    },
    ranged(g, cx, cy, r) {
        g.fillRect(cx + r - 2, cy - 3, 8, 6); g.fillCircle(cx, cy, r); g.strokeCircle(cx, cy, r);
        g.fillStyle(0xffffff, 1).fillCircle(cx, cy, r * 0.55); g.fillStyle(0x111111, 1).fillCircle(cx + 2, cy, r * 0.28);
    },
    archer(g, cx, cy, r) {
        poly(g, cx, cy + 1, r + 3, 3, -Math.PI / 2); eyes(g, cx, cy + 3, 4, 2.5);
        g.lineStyle(2, 0x333333, 1).lineBetween(cx, cy - r - 4, cx, cy - r + 3);
    },
    mage(g, cx, cy, r) {
        g.fillCircle(cx, cy + 3, r - 1); g.strokeCircle(cx, cy + 3, r - 1); eyes(g, cx, cy + 5, 4, 3);
        g.fillStyle(0x5a2a99, 1).fillTriangle(cx - r, cy - 1, cx + r, cy - 1, cx, cy - r - 6);
        g.fillStyle(0xffee55, 1).fillCircle(cx, cy - r * 0.4, 2);
    },
    control(g, cx, cy, r) {
        g.lineStyle(3, 0xaaffff, 1);
        for (let i = 0; i < 3; i++) { let a = i * Math.PI / 3; g.lineBetween(cx + Math.cos(a) * (r + 5), cy + Math.sin(a) * (r + 5), cx - Math.cos(a) * (r + 5), cy - Math.sin(a) * (r + 5)); }
        g.fillStyle(0x44e0e0, 1).fillCircle(cx, cy, r * 0.7); g.lineStyle(2, 0x000000, 0.8).strokeCircle(cx, cy, r * 0.7); eyes(g, cx, cy, 3.5, 2.5);
    }
};

// 產生所有貼圖（只做一次）
function makeTextures(scene) {
    if (scene.textures.exists('bg')) return;
    const mk = (key, size, fn) => {
        let g = scene.make.graphics({ x: 0, y: 0, add: false });
        fn(g, size / 2, size / 2); g.generateTexture(key, size, size); g.destroy();
    };
    const R = Phaser.Math.Between, F = Phaser.Math.FloatBetween;
    // 星雲背景（可無縫平鋪：每個色塊在 3×3 位移都畫一次）
    mk('bg', 1024, (g) => {
        g.fillStyle(0x090d1c, 1).fillRect(0, 0, 1024, 1024);
        const cols = [0x2b1b66, 0x0f3d5e, 0x4d1650, 0x12335a];
        for (let i = 0; i < 16; i++) {
            let x = R(0, 1023), y = R(0, 1023), r = R(90, 220), c = cols[i % cols.length];
            for (let ox = -1024; ox <= 1024; ox += 1024) for (let oy = -1024; oy <= 1024; oy += 1024)
                [1, 0.7, 0.45, 0.22].forEach(k => g.fillStyle(c, 0.06).fillCircle(x + ox, y + oy, r * k));
        }
        for (let i = 0; i < 260; i++) g.fillStyle(0xaac4ff, F(0.05, 0.35)).fillCircle(R(0, 1023), R(0, 1023), F(0.6, 1.4));
    });
    mk('stars', 1024, (g) => {
        for (let i = 0; i < 90; i++) {
            let x = R(0, 1023), y = R(0, 1023), r = F(0.8, 2);
            g.fillStyle(0xffffff, F(0.5, 1)).fillCircle(x, y, r);
            if (i % 9 === 0) g.lineStyle(1, 0xffffff, 0.6).lineBetween(x - 5, y, x + 5, y).lineBetween(x, y - 5, x, y + 5);
        }
    });
    // 角色
    CHARACTERS.forEach((c, i) => mk('hero' + i, 52, (g, cx, cy) => {
        if (c.r >= 2) g.lineStyle(2, RAR[c.r].c, 0.9).strokeCircle(cx, cy, 25);
        g.fillStyle(c.color, 1).lineStyle(3, 0xffffff, 1); poly(g, cx, cy, 21, c.sides, c.rot);
        eyes(g, cx, cy + c.ey, 6, 4);
        if (c.angry) g.lineStyle(2, 0x111111, 1).lineBetween(cx - 11, cy - 8, cx - 2, cy - 4).lineBetween(cx + 11, cy - 8, cx + 2, cy - 4);
    }));
    // 星球
    PLANETS.forEach((P, i) => mk('planet' + i, P.T, (g, cx, cy) => {
        g.fillStyle(P.c, 1).fillCircle(cx, cy, P.r);
        [-0.6, -0.25, 0.15, 0.5].forEach(j => { let dy = P.r * j, hw = Math.sqrt(P.r * P.r - dy * dy) - 4; g.lineStyle(7, 0x000000, 0.18).lineBetween(cx - hw, cy + dy, cx + hw, cy + dy); });
        g.fillStyle(0xffffff, 0.12).fillCircle(cx - P.r * 0.3, cy - P.r * 0.3, P.r * 0.35);
        g.lineStyle(3, 0xffffff, 0.25).strokeCircle(cx, cy, P.r);
        if (P.ring) g.lineStyle(7, 0xe8d8b0, 0.8).strokeEllipse(cx, cy, P.r * 2.6, P.r * 0.7);
    }));
    // 飛船
    mk('ship', 64, (g, cx, cy) => {
        g.fillStyle(0xff9933, 1).fillTriangle(cx - 22, cy - 6, cx - 31, cy, cx - 22, cy + 6);
        g.fillStyle(0xcfd8e8, 1).lineStyle(2, 0x445066, 1).fillTriangle(cx + 28, cy, cx - 22, cy - 15, cx - 22, cy + 15);
        g.strokeTriangle(cx + 28, cy, cx - 22, cy - 15, cx - 22, cy + 15);
        g.fillStyle(0xff4455, 1).fillRect(cx - 18, cy - 2, 14, 4);
        g.fillStyle(0x44ccff, 1).fillCircle(cx + 7, cy, 5);
    });
    // 衛星
    mk('sat', 48, (g, cx, cy) => {
        g.fillStyle(0x3a7ac0, 1).lineStyle(1, 0xaad4ff, 1);
        g.fillRect(cx - 22, cy - 6, 13, 12).strokeRect(cx - 22, cy - 6, 13, 12).fillRect(cx + 9, cy - 6, 13, 12).strokeRect(cx + 9, cy - 6, 13, 12);
        g.fillStyle(0xbfc6d4, 1).lineStyle(2, 0x445066, 1).fillRect(cx - 9, cy - 9, 18, 18).strokeRect(cx - 9, cy - 9, 18, 18);
        g.lineStyle(2, 0xffffff, 1).lineBetween(cx, cy - 9, cx, cy - 18); g.fillStyle(0xff4455, 1).fillCircle(cx, cy - 19, 2.5);
        eyes(g, cx, cy, 4, 2.5);
    });
    // 一般敵人
    Object.entries(ENEMY_TYPES).forEach(([k, T]) => mk('e_' + k, T.r * 2 + 18, (g, cx, cy) => {
        g.fillStyle(T.color, 1).lineStyle(2, 0x000000, 0.8); ENEMY_DRAW[k](g, cx, cy, T.r);
    }));
    // 信使 NPC：背著袋子逃跑的小傢伙（npc0 = 金幣袋，npc1 = 抽獎券袋）
    [0xffd24a, 0xff7ab8].forEach((bag, i) => mk('npc' + i, 44, (g, cx, cy) => {
        g.fillStyle(bag, 1).lineStyle(2, 0x000000, 0.8).fillCircle(cx + 9, cy - 9, 9).strokeCircle(cx + 9, cy - 9, 9);   // 背上的袋子
        g.fillStyle(0xe8f0ff, 1).fillCircle(cx - 2, cy + 2, 14).strokeCircle(cx - 2, cy + 2, 14);                          // 身體
        eyes(g, cx - 2, cy, 5, 3.5);                                                                                      // 驚恐的眼睛
        g.fillStyle(0x66ccff, 1).fillCircle(cx - 15, cy - 8, 2.5);                                                         // 冷汗
    }));
    // 時空裂縫：同心圓 + 旋轉紋路
    mk('rift', 120, (g, cx, cy) => {
        for (let i = 0; i < 8; i++) g.lineStyle(6, i % 2 ? 0x9a4cff : 0x3a1f8a, 0.95 - i * 0.07).strokeCircle(cx, cy, 56 - i * 6);
        g.fillStyle(0x000000, 1).fillCircle(cx, cy, 12);
        for (let j = 0; j < 4; j++) { let a = j * Math.PI / 2; g.lineStyle(3, 0xd8b0ff, 0.8).lineBetween(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14, cx + Math.cos(a + 0.8) * 50, cy + Math.sin(a + 0.8) * 50); }
    });
    // BOSS：帶尖刺的巨大怪物
    mk('boss', 160, (g, cx, cy) => {
        g.fillStyle(0x5a0a2a, 1);
        for (let i = 0; i < 12; i++) { let a = i * Math.PI / 6; g.fillTriangle(cx + Math.cos(a - 0.22) * 52, cy + Math.sin(a - 0.22) * 52, cx + Math.cos(a) * 76, cy + Math.sin(a) * 76, cx + Math.cos(a + 0.22) * 52, cy + Math.sin(a + 0.22) * 52); }
        g.fillStyle(0xb01848, 1).lineStyle(4, 0xffffff, 0.9).fillCircle(cx, cy, 56).strokeCircle(cx, cy, 56);
        g.fillStyle(0xffffff, 1).fillCircle(cx - 20, cy - 8, 12).fillCircle(cx + 20, cy - 8, 12);
        g.fillStyle(0xff2222, 1).fillCircle(cx - 18, cy - 6, 6).fillCircle(cx + 18, cy - 6, 6);
        g.lineStyle(5, 0x111111, 1).lineBetween(cx - 34, cy - 26, cx - 8, cy - 14).lineBetween(cx + 34, cy - 26, cx + 8, cy - 14);   // 怒眉
        g.lineStyle(4, 0x111111, 1);
        for (let i = 0; i < 5; i++) g.lineBetween(cx - 24 + i * 12, cy + 22 + (i % 2 ? 8 : 0), cx - 12 + i * 12, cy + 22 + (i % 2 ? 0 : 8));   // 鋸齒嘴
    });
}

// ============================================================
//  共用 UI（圓角面板 / 按鈕 / 標題）
// ============================================================
// 在已有的 Graphics 上畫一張圓角卡片（x, y 為左上角）。o: r 圓角 / fill 底色 / a 透明度 / stroke 邊框色 / bw 邊框寬 / glow 外發光
function drawPanel(g, x, y, w, h, o = {}) {
    const rad = o.r ?? 14, sc = o.stroke ?? 0x4a6fb5;
    g.fillStyle(0x000000, 0.35).fillRoundedRect(x + 2, y + 5, w, h, rad);                       // 陰影
    g.fillStyle(o.fill ?? 0x141d33, o.a ?? 0.92).fillRoundedRect(x, y, w, h, rad);              // 底色
    g.fillStyle(0xffffff, 0.05).fillRoundedRect(x + 2, y + 2, w - 4, h * 0.45, { tl: Math.max(2, rad - 2), tr: Math.max(2, rad - 2), bl: 2, br: 2 });   // 上緣高光
    if (o.glow) g.lineStyle(6, sc, 0.2).strokeRoundedRect(x - 2, y - 2, w + 4, h + 4, rad + 2);  // 外發光
    g.lineStyle(o.bw ?? 2, sc, 1).strokeRoundedRect(x, y, w, h, rad);
    return g;
}
// 以中心點建立一張獨立的面板（o.d 深度、o.fixed 是否固定在螢幕上不隨鏡頭移動）
function panel(s, cx, cy, w, h, o = {}) {
    const g = s.add.graphics(); drawPanel(g, cx - w / 2, cy - h / 2, w, h, o);
    g.setDepth(o.d ?? 0); if (o.fixed) g.setScrollFactor(0);
    return g;
}
// 文字 + 自動撐開的底板，回傳 { t: 文字物件, g: 底板 }
function infoPill(s, cx, cy, str, style, o = {}) {
    const d = o.d ?? 0;
    const t = s.add.text(cx, cy, str, style).setOrigin(0.5).setDepth(d + 2);
    const pw = o.w ?? W - 20, ph = Math.max(o.minH ?? 0, t.height + 14);
    const g = panel(s, cx, cy, pw, ph, Object.assign({ r: 10, fill: 0x0e1526, bw: 1, stroke: 0x2a3a5e }, o, { d: d + 1 }));
    return { t, g };
}
// 立體圓角按鈕（含懸停、按下效果）
// bg 可為 '#rrggbb' 或數字；o: { w 最小寬, d 深度, fixed 固定螢幕, delay 延遲幾毫秒才可點 }
// 回傳 { zone, destroy() }
function btn(s, x, y, label, fn, bg = '#2a7de1', size = 20, o = {}) {
    const col = typeof bg === 'string' ? parseInt(bg.slice(1), 16) : bg, d = o.d ?? 1;
    const t = s.add.text(x, y, label, { fontSize: size + 'px', color: '#fff', fontStyle: 'bold', align: 'center', lineSpacing: 2, stroke: '#000', strokeThickness: 3,
        shadow: { offsetX: 0, offsetY: 2, color: '#000', blur: 4, fill: true } }).setOrigin(0.5).setDepth(d + 2);
    const w = Math.max(o.w || 0, t.width + size * 1.8), h = t.height + size * 0.8, r = Math.min(16, h / 2.2);
    const g = s.add.graphics().setDepth(d + 1);
    const z = s.add.zone(x, y, w, h).setDepth(d + 3).setInteractive({ useHandCursor: true });   // 透明的點擊區
    if (o.fixed) [t, g, z].forEach(i => i.setScrollFactor(0));
    const lighten = (c) => Phaser.Display.Color.ValueToColor(c).lighten(22).color;
    const darken = (c) => Phaser.Display.Color.ValueToColor(c).darken(35).color;
    const paint = (hover, press) => {                  // 依狀態重畫按鈕外觀
        const c = hover ? lighten(col) : col, yo = press ? 3 : 0;
        g.clear();
        g.fillStyle(0x000000, 0.4).fillRoundedRect(x - w / 2, y - h / 2 + 5, w, h, r);
        g.fillStyle(darken(c), 1).fillRoundedRect(x - w / 2, y - h / 2 + yo, w, h, r);
        g.fillStyle(c, 1).fillRoundedRect(x - w / 2, y - h / 2 + yo, w, h - 4, r);
        g.fillStyle(0xffffff, 0.2).fillRoundedRect(x - w / 2 + 3, y - h / 2 + 3 + yo, w - 6, h * 0.38, Math.max(2, r - 3));
        g.lineStyle(2, 0xffffff, hover ? 0.85 : 0.4).strokeRoundedRect(x - w / 2, y - h / 2 + yo, w, h - 4, r);
        t.setY(y + yo);
    };
    paint(false, false);
    z.on('pointerover', () => paint(true, false)).on('pointerout', () => paint(false, false))
     .on('pointerdown', () => { paint(true, true); fn(); }).on('pointerup', () => { if (z.scene) paint(true, false); });
    if (o.delay) { z.disableInteractive(); s.time.delayedCall(o.delay, () => { if (z.scene) z.setInteractive({ useHandCursor: true }); }); }   // 避免結算畫面誤觸
    return { zone: z, destroy() { [t, g, z].forEach(i => i.destroy()); } };
}
// 選單用的星空背景
function menuBg(s) {
    s.cameras.main.setBackgroundColor('#090d1c');
    s.add.tileSprite(0, 0, W, H, 'bg').setOrigin(0); s.add.tileSprite(0, 0, W, H, 'stars').setOrigin(0);
}
// 畫面標題（金色字 + 下方裝飾線）
function title(s, t) {
    s.add.text(W / 2, 36, t, { fontSize: '28px', color: '#ffd700', fontStyle: 'bold', stroke: '#5a3b00', strokeThickness: 5,
        shadow: { offsetX: 0, offsetY: 3, color: '#000', blur: 8, fill: true } }).setOrigin(0.5);
    const g = s.add.graphics();
    g.lineStyle(2, 0xffd700, 0.5).lineBetween(W / 2 - 90, 64, W / 2 - 8, 64).lineBetween(W / 2 + 8, 64, W / 2 + 90, 64);
    g.fillStyle(0xffd700, 1).fillCircle(W / 2, 64, 3);
}
const fmtT = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec) % 60).padStart(2, '0')}`;

// ============================================================
//  出發準備（選角色 / 武器 / 被動），橫向三張卡片
// ============================================================
class LoadoutScene extends Phaser.Scene {
    constructor() { super('LoadoutScene'); }
    opts(cat) { return (cat.key === 'p' ? [-1] : []).concat(S[cat.u]); }   // 被動多一個「不裝備」
    create() {
        makeTextures(this); menuBg(this); title(this, '出發準備');
        this.cols = CATS.map((cat, i) => {
            const cx = 170 + i * 310;
            const cardG = this.add.graphics().setDepth(1);
            panel(this, cx, 104, 80, 22, { r: 8, fill: 0x24365e, bw: 1, stroke: 0x4a6fb5, d: 2 });
            this.add.text(cx, 104, cat.label, { fontSize: '12px', color: '#bcd0ff', fontStyle: 'bold' }).setOrigin(0.5).setDepth(3);
            const img = this.add.image(cx, 168, 'hero0').setScale(1.6).setDepth(3).setVisible(cat.key === 'c');
            const icT = this.add.text(cx, 168, '', { fontSize: '50px' }).setOrigin(0.5).setDepth(3);
            const nameT = this.add.text(cx, 226, '', { fontSize: '19px', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(3);
            const descT = this.add.text(cx, 272, '', { fontSize: '13px', color: '#d6e0f5', align: 'center', lineSpacing: 3, wordWrap: { width: 250 } }).setOrigin(0.5).setDepth(3);
            const infoT = this.add.text(cx, 334, '', { fontSize: '12px', color: '#9fe3ff', align: 'center', lineSpacing: 3, wordWrap: { width: 250 } }).setOrigin(0.5).setDepth(3);
            btn(this, cx - 100, 392, '◀', () => this.cycle(cat, -1), '#3a4a7a', 20, { w: 50 });
            btn(this, cx + 100, 392, '▶', () => this.cycle(cat, 1), '#3a4a7a', 20, { w: 50 });
            return { cat, cx, img, icT, nameT, descT, infoT, cardG };
        });
        btn(this, W / 2, 480, '⚔  開始戰鬥', () => this.scene.start('GameScene', { c: S.sel.c, w: S.sel.w, p: S.sel.p }), '#2a7de1', 24, { w: 290 });
        btn(this, 60, 36, '‹ 返回', () => this.scene.start('MenuScene'), '#444a5a', 14);
        this.refresh();
    }
    cycle(cat, d) {   // 切換該分類的選擇
        let o = this.opts(cat), i = o.indexOf(S.sel[cat.key]);
        S.sel[cat.key] = o[(i + d + o.length) % o.length]; save(); this.refresh();
    }
    refresh() {
        this.cols.forEach(({ cat, cx, img, icT, nameT, descT, infoT, cardG }) => {

            cardG.clear(); drawPanel(cardG, cx - 145, 80, 290, 340, { stroke: it ? RAR[it.r].c : 0x3b5a96, glow: !!it, fill: 0x121b31 });

class UpgradeScene extends Phaser.Scene {
    constructor() { super('UpgradeScene'); }
    create() {
        makeTextures(this); menuBg(this); title(this, '🔧 養成');
        this.tab = 0; this.idx = Math.max(0, S.uc.indexOf(S.sel.c)); this.dyn = [];
        btn(this, 60, 36, '‹ 返回', () => this.scene.start('MenuScene'), '#444a5a', 14);
        this.coinT = infoPill(this, 850, 36, ' ', { fontSize: '16px', color: '#ffd700', fontStyle: 'bold' }, { w: 190, minH: 30, stroke: 0x8a6a1a }).t;
        this.toast = this.add.text(700, 82, '', { fontSize: '13px', color: '#ffd700', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(5);
        this.refresh();
    }
    say(msg, ok) { this.toast.setText(msg).setColor(ok ? '#7fe3a0' : '#ff8a8a'); }
    // 目前頁籤要顯示哪些養成列：{ name, ic, lv, max, cost, txt, set }
    rowsFor(cat, id) {
        const it = cat.list[id];
        if (cat.key === 'c') {
            const m = metaOf(id);
            return CSTATS.map(st => ({ name: st.name, ic: st.ic, lv: m[st.k], max: st.max, cost: st.cost, txt: st.txt(m[st.k]), set: v => { m[st.k] = v; } }))
                .concat([{ name: '技能：' + it.sk.name, ic: '✨', lv: m.skill, max: SKILL_MAX, cost: SKILL_COST, txt: it.sk.txt(m.skill), set: v => { m.skill = v; } }]);
        }
        const wm = wmetaOf(id);
        return WSTATS.map(st => ({ name: st.name, ic: st.ic, lv: wm[st.k], max: st.max, cost: st.cost, txt: st.txt(wm[st.k]), set: v => { wm[st.k] = v; } }))
            .concat([{ name: '專屬：' + it.spec.name, ic: it.ic, lv: wm.spec, max: it.spec.max, cost: it.spec.cost, txt: it.spec.txt(wm.spec), set: v => { wm.spec = v; } }]);
    }
    buy(row) {            // 升級：扣金幣
        if (row.lv >= row.max) return;
        const c = upCost(row.cost, row.lv);
        if (S.coins < c) { this.say('金幣不足！', false); return; }
        S.coins -= c; row.set(row.lv + 1); save(); this.say(`${row.name} 升到 Lv${row.lv + 1}`, true); this.refresh();
    }
    undo(row) {           // 降級（取消升級）：只退還該級花費的 50%
        if (row.lv <= 0) return;
        const r = refundOf(row.cost, row.lv);
        S.coins += r; row.set(row.lv - 1); save(); this.say(`${row.name} 降回 Lv${row.lv - 1}，退還 🪙${r}（50%）`, true); this.refresh();
    }
    refresh() {
        this.dyn.forEach(o => o.destroy()); this.dyn = [];
        this.coinT.setText(`🪙 ${S.coins}`);
        // 頁籤：角色 / 武器
        ['角色', '武器'].forEach((n, i) => this.dyn.push(btn(this, 400 + i * 125, 82, n, () => {
            this.tab = i; this.idx = Math.max(0, (i ? S.uw : S.uc).indexOf(i ? S.sel.w : S.sel.c)); this.toast.setText(''); this.refresh();
        }, i === this.tab ? '#2a7de1' : '#2a3558', 15, { w: 105 })));
        const cat = CATS[this.tab], owned = S[cat.u], id = owned[this.idx], it = cat.list[id], rc = RAR[it.r].c;
        // 左側：目前選擇的項目
        this.dyn.push(panel(this, 155, 315, 270, 410, { stroke: rc, glow: true, fill: 0x121b31, d: 1 }));
        if (cat.key === 'c') this.dyn.push(this.add.image(155, 185, 'hero' + id).setScale(2.2).setDepth(3));
        else this.dyn.push(this.add.text(155, 185, it.ic, { fontSize: '66px' }).setOrigin(0.5).setDepth(3));
        this.dyn.push(
            this.add.text(155, 260, it.name, { fontSize: '22px', color: hex(rc), fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(3),
            this.add.text(155, 288, `${RAR[it.r].n}　${starStr(cat.key, id) || '（未升星）'}`, { fontSize: '13px', color: '#ffd24a' }).setOrigin(0.5).setDepth(3),
            this.add.text(155, 345, it.desc, { fontSize: '13px', color: '#d6e0f5', align: 'center', lineSpacing: 3, wordWrap: { width: 230 } }).setOrigin(0.5).setDepth(3),
            this.add.text(155, 455, `${this.idx + 1} / ${owned.length}`, { fontSize: '14px', color: '#9bb4ee' }).setOrigin(0.5).setDepth(3));
        const step = (d) => { this.idx = (this.idx + d + owned.length) % owned.length; this.toast.setText(''); this.refresh(); };
        this.dyn.push(btn(this, 60, 490, '◀', () => step(-1), '#3a4a7a', 20, { w: 52 }), btn(this, 250, 490, '▶', () => step(1), '#3a4a7a', 20, { w: 52 }));
        // 右側：養成列表
        this.rowsFor(cat, id).forEach((row, i) => {
            const y = 138 + i * 54;
            this.dyn.push(panel(this, 625, y, 630, 48, { r: 10, fill: 0x141d33, bw: 1, stroke: row.lv >= row.max ? 0xffd24a : 0x3b5a96, d: 1 }));
            this.dyn.push(

            const bar = this.add.graphics().setDepth(3);       // 等級進度條
            bar.fillStyle(0x000000, 0.6).fillRoundedRect(605, y + 6, 100, 7, 3);
            bar.fillStyle(row.lv >= row.max ? 0xffd24a : 0x00ff88, 1).fillRoundedRect(605, y + 6, 100 * row.lv / row.max, 7, 3);
            this.dyn.push(bar);
            // 降級（退 50%）與升級按鈕
            const rf = row.lv > 0 ? refundOf(row.cost, row.lv) : 0;

            if (row.lv >= row.max) this.dyn.push(btn(this, 872, y, 'MAX', () => {}, '#8a6a1a', 14, { w: 100 }));
            else { const c = upCost(row.cost, row.lv); this.dyn.push(btn(this, 872, y, `升級 🪙${c}`, () => this.buy(row), S.coins >= c ? '#2a9d5c' : '#5a3a3a', 14, { w: 100 })); }
        });
        this.dyn.push(this.add.text(625, 138 + (cat.key === 'c' ? 7 : 3) * 54 - 20, '提示：降級只會退還該級花費的 50%，請謹慎升級', { fontSize: '12px', color: '#7f93b8' }).setOrigin(0.5).setDepth(3));
    }
}

class GachaScene extends Phaser.Scene {
    constructor() { super('GachaScene'); }
    create() {
        makeTextures(this); menuBg(this); title(this, '🎰 抽獎');
        this.dyn = []; this.autoBtns = []; this.busy = false;

        this.drawAuto();
        // 結果展示區（左）
        this.card = this.add.graphics().setDepth(1);
        this.resImg = this.add.image(300, 245, 'hero0').setVisible(false).setScale(2).setDepth(3);
        this.resIc = this.add.text(300, 245, '', { fontSize: '64px' }).setOrigin(0.5).setDepth(3);
        this.resName = this.add.text(300, 310, '', { fontSize: '24px', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(3);
        this.resDesc = this.add.text(300, 348, '', { fontSize: '13px', color: '#d6e0f5', align: 'center', lineSpacing: 3, wordWrap: { width: 420 } }).setOrigin(0.5).setDepth(3);
        this.toastT = this.add.text(300, 395, '', { fontSize: '14px', color: '#ffd700', align: 'center', fontStyle: 'bold', stroke: '#000', strokeThickness: 3, wordWrap: { width: 440 } }).setOrigin(0.5).setDepth(3);
        // 抽獎按鈕（右）：每個分類一列，左單抽右十連
        CATS.forEach((cat, i) => {
            btn(this, 650, 200 + i * 90, `抽${cat.label}\n🎟×1`, () => this.pull(cat, 1), '#b0508a', 16, { w: 150 });
            btn(this, 830, 200 + i * 90, `十連${cat.label}\n🎟×10`, () => this.pull(cat, 10), '#7a3a9a', 16, { w: 150 });
        });
        infoPill(this, W / 2, 497, '機率：常見60% 稀有27% 史詩9% 傳說3.4% 秘密0.6%　30 抽保底史詩以上　十連保底至少 1 個稀有以上\n重複的角色會詢問「升星」或「賣掉換金幣」（最高 ★5）；武器／被動重複自動升星；開啟上方「自動賣出」的稀有度則直接換金幣',
            { fontSize: '11px', color: '#8da2cc', align: 'center', lineSpacing: 3, wordWrap: { width: 880 } }, { w: 920 });
        this.refreshInfo();
    }
    drawAuto() {          // 畫 5 顆稀有度開關
        this.autoBtns.forEach(b => b.destroy()); this.autoBtns = [];
        RAR.forEach((r, i) => {
            const on = S.auto[i];
            this.autoBtns.push(btn(this, 250 + i * 125, 124, `${r.n} ${on ? '✔賣出' : '詢問'}`, () => { S.auto[i] = !S.auto[i]; save(); this.drawAuto(); },
                on ? r.c : '#2a3558', 12, { w: 112 }));
        });
    }
    refreshInfo() { this.info.setText(`🪙 ${S.coins}　🎟 ${S.tickets}　星塵 ${S.dust}/10　保底 ${S.pity}/30　收藏 ${S.uc.length + S.uw.length + S.up.length}/${TOTAL}`); }

    // 抽一次：只決定「抽到哪個項目」，是否重複與如何處理留到 resolve() 依序判斷
    roll(cat, minR) {
        let r = rollRarity(minR); S.pity = r >= 2 ? 0 : S.pity + 1;
        let pool = []; while (!pool.length) { pool = cat.list.filter(it => it.r === r); if (!pool.length) r--; }
        return Phaser.Utils.Array.GetRandom(pool);
    }
    pull(cat, n) {
        if (this.busy) return;
        if (S.tickets < n) { this.card.clear(); this.toastT.setColor('#ff8a8a').setText(`抽獎券不足（需要 ${n} 張）！\n存活每 2 分鐘可獲得 1 張，圖鑑收集也會送券`); return; }
        S.tickets -= n; this.busy = true;
        let rolls = [];
        for (let i = 0; i < n; i++) rolls.push(this.roll(cat, (n === 10 && i === 9 && !rolls.some(x => x.r >= 1)) ? 1 : 0));   // 十連保底稀有以上
        this.resolve(cat, rolls, 0, [], { mode: null });
    }
    // 依序處理每一抽：新獲得 / 自動賣出 / 滿星 / 詢問升星或賣掉
    resolve(cat, rolls, i, out, batch) {
        if (i >= rolls.length) return this.finish(cat, out);
        const it = rolls[i], k = cat.key;
        const next = (tag) => { out.push({ it, tag }); this.resolve(cat, rolls, i + 1, out, batch); };
        if (!S[cat.u].includes(it.id)) { S[cat.u].push(it.id); return next('✨NEW'); }
        if (S.auto[it.r]) { S.coins += SELL_PRICE[it.r]; return next(`賣出 🪙+${SELL_PRICE[it.r]}`); }      // 該稀有度設為自動賣出
        const st = starOf(k, it.id);
        if (st >= MAXSTAR) {                                                                                  // 已滿星 → 星塵
            S.dust += it.r + 1; let tag = `滿星 星塵+${it.r + 1}`;
            while (S.dust >= 10) { S.dust -= 10; S.tickets++; tag += '（券+1）'; }
            return next(tag);
        }
        const apply = (mode) => {
            if (mode === 'sell') { S.coins += SELL_PRICE[it.r]; next(`賣出 🪙+${SELL_PRICE[it.r]}`); }
            else { S.star[k][it.id] = st + 1; next(`升星 ★${st + 1}`); }
        };
        if (k !== 'c') return apply('star');            // 武器 / 被動：重複直接升星
        if (batch.mode) return apply(batch.mode);       // 十連中已選「全部…」
        this.askDup(it, st, rolls.length - i - 1, (mode, all) => { if (all) batch.mode = mode; apply(mode); });
    }
    // 重複角色的詢問視窗：升星 or 轉成金幣（十連時還可「全部…」）
    askDup(it, st, remain, cb) {
        const ui = [], cx = W / 2, cy = H / 2, rc = RAR[it.r].c, price = SELL_PRICE[it.r];
        ui.push(this.add.rectangle(cx, cy, W, H, 0x000000, 0.72).setDepth(500).setInteractive());   // 擋住底下的按鈕
        ui.push(panel(this, cx, cy, 580, 270, { stroke: rc, glow: true, fill: 0x141d33, a: 0.98, d: 501, r: 18 }));
        ui.push(this.add.text(cx, cy - 105, '已擁有此角色', { fontSize: '20px', color: '#ffd700', fontStyle: 'bold', stroke: '#5a3b00', strokeThickness: 4 }).setOrigin(0.5).setDepth(503));
        ui.push(this.add.image(cx - 190, cy - 30, 'hero' + it.id).setScale(2).setDepth(503));
        ui.push(this.add.text(cx - 100, cy - 30, `【${it.name}】${RAR[it.r].n}　目前 ${'★'.repeat(st) || '無星'}\n\n⭐ 升星 → ★${st + 1}（${STAR_TXT.c}）\n🪙 或轉成金幣 +${price}`,
            { fontSize: '15px', color: '#e6eeff', lineSpacing: 5 }).setOrigin(0, 0.5).setDepth(503));
        const done = (mode, all) => { ui.forEach(o => o.destroy()); cb(mode, all); };
        const o = { d: 510 };
        ui.push(btn(this, cx - 90, cy + 55, '⭐ 升星', () => done('star', false), '#d08a2a', 18, Object.assign({ w: 150 }, o)));
        ui.push(btn(this, cx + 90, cy + 55, `🪙 賣掉 +${price}`, () => done('sell', false), '#2a9d5c', 18, Object.assign({ w: 150 }, o)));
        if (remain > 0) {        // 十連：後面還有抽，提供「全部…」
            ui.push(btn(this, cx - 90, cy + 108, `之後全部升星`, () => done('star', true), '#7a5a2a', 13, Object.assign({ w: 150 }, o)));
            ui.push(btn(this, cx + 90, cy + 108, `之後全部賣掉`, () => done('sell', true), '#1f6a40', 13, Object.assign({ w: 150 }, o)));
        }
    }
    finish(cat, out) {       // 全部處理完：算里程碑、存檔、顯示結果
        const ms = checkMilestones(); save(); this.refreshInfo(); this.busy = false;
        this.dyn.forEach(o => o.destroy()); this.dyn = []; this.card.clear();
        this.toastT.setColor('#ffd700');
        const ext = ms.map(m => `\n🎉 圖鑑收集 ${m.n} 件！獲得 🎟×${m.t}`).join('');
        if (out.length === 1) {
            const { it, tag } = out[0], rc = RAR[it.r].c;
            drawPanel(this.card, 300 - 230, 175, 460, 250, { stroke: rc, glow: true, fill: 0x141d33 });
            this.resImg.setVisible(cat.key === 'c'); if (cat.key === 'c') this.resImg.setTexture('hero' + it.id);
            this.resIc.setText(cat.key === 'c' ? '' : it.ic);
            this.resName.setText(`${it.name}　${RAR[it.r].n}`).setColor(hex(rc));
            this.resDesc.setText(it.desc);
            this.toastT.setText(tag + ext).setY(395);
            this.tweens.add({ targets: this.resImg, scale: { from: 1, to: 2 }, duration: 250, ease: 'Back.Out' });
            this.tweens.add({ targets: [this.resIc, this.resName], scale: { from: 0.5, to: 1 }, duration: 250, ease: 'Back.Out' });
        } else {
            this.resImg.setVisible(false); this.resIc.setText(''); this.resName.setText(''); this.resDesc.setText('');
            const cw = 218, rowH = 44;          // 十連：2 欄 × 5 列的小卡片
            out.forEach(({ it, tag }, i) => {
                const rc = RAR[it.r].c, x = 300 + (i % 2 ? 1 : -1) * (cw / 2 + 4), y = 168 + Math.floor(i / 2) * (rowH + 6) + rowH / 2;
                const g = this.add.graphics().setDepth(4);
                drawPanel(g, x - cw / 2, y - rowH / 2, cw, rowH, { r: 10, stroke: rc, fill: 0x141d33, glow: it.r >= 2, bw: 2 });
                const t1 = this.add.text(x - cw / 2 + 12, y - 8, `${cat.key === 'c' ? '👤' : it.ic} ${it.name}`, { fontSize: '14px', color: hex(rc), fontStyle: 'bold' }).setOrigin(0, 0.5).setDepth(5);
                const t2 = this.add.text(x - cw / 2 + 12, y + 10, `${RAR[it.r].n} · ${tag}`, { fontSize: '11px', color: tag.includes('NEW') ? '#ffe066' : '#c8d4ee' }).setOrigin(0, 0.5).setDepth(5);
                this.dyn.push(g, t1, t2);
                this.tweens.add({ targets: [g, t1, t2], alpha: { from: 0, to: 1 }, delay: i * 70, duration: 150 });
            });
            this.toastT.setText('十連結果' + ext).setY(168 + 5 * (rowH + 6) + 14);
        }
    }
}

            if (got) g.fillStyle(rc, 0.9).fillRoundedRect(x - cw / 2 + 10, y + ch / 2 - 10, cw - 20, 3, 1.5);   // 稀有度色條
