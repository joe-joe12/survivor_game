<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶可夢倖存者</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
    </style>
</head>
<body>
<div id="canvas-container"></div>

<script>
class GameScene extends Phaser.Scene {
    constructor() {
        super('GameScene');
        this.exp = 0;
        this.maxExp = 5;
        this.level = 1;
        this.moveSpeed = 180;
        this.mapSize = 2000;
        
        this.joystickDir = { x: 0, y: 0 };
        this.joystickTouchId = null;
        this.joystickStartPos = { x: 0, y: 0 };
    }

    create() {
        // 1. 設定世界邊界
        this.physics.world.setBounds(0, 0, this.mapSize, this.mapSize);

        // 2. 畫網格背景與紅色邊框
        let bgGraphics = this.add.graphics();
        let gridSize = 80;
        bgGraphics.lineStyle(1, 0x333333, 0.8);
        for (let x = 0; x <= this.mapSize; x += gridSize) {
            bgGraphics.moveTo(x, 0);
            bgGraphics.lineTo(x, this.mapSize);
        }
        for (let y = 0; y <= this.mapSize; y += gridSize) {
            bgGraphics.moveTo(0, y);
            bgGraphics.lineTo(this.mapSize, y);
        }
        bgGraphics.strokePath();
        
        bgGraphics.lineStyle(6, 0xff2222, 1);
        bgGraphics.strokeRect(0, 0, this.mapSize, this.mapSize);

        // 3. 建立玩家 (藍色圓圈)
        this.player = this.add.circle(this.mapSize / 2, this.mapSize / 2, 15, 0x00aaff);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);

        // 4. 攝影機跟隨
        this.cameras.main.setBounds(0, 0, this.mapSize, this.mapSize);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        // 5. 虛擬搖桿 UI (鎖定在 UI 螢幕層)
        this.joystickBase = this.add.circle(0, 0, 50, 0xffffff, 0.25).setScrollFactor(0).setDepth(100).setVisible(false);
        this.joystickThumb = this.add.circle(0, 0, 25, 0xffffff, 0.65).setScrollFactor(0).setDepth(101).setVisible(false);

        // 6. 改用原生 DOM Touch 事件，完全排除 Phaser 座標偏移問題
        this.setupDOMTouchControls();

        // 物件群組
        this.enemies = this.physics.add.group();
        this.bullets = this.physics.add.group();
        this.gems = this.physics.add.group();

        // 鍵盤輸入相容
        this.cursors = this.input.keyboard.createCursorKeys();

        // UI 介面
        this.uiText = this.add.text(16, 16, `等級: ${this.level} | 經驗: ${this.exp}/${this.maxExp}`, {
            fontSize: '18px',
            color: '#ffffff',
            backgroundColor: '#00000088',
            padding: { x: 10, y: 5 }
        }).setScrollFactor(0).setDepth(200);

        // 定時產生敵人與自動攻擊
        this.time.addEvent({ delay: 800, callback: this.autoAttack, callbackScope: this, loop: true });
        this.time.addEvent({ delay: 1000, callback: this.spawnEnemy, callbackScope: this, loop: true });

        // 碰撞設定
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.player, this.gems, this.collectGem, null, this);
    }

    setupDOMTouchControls() {
        const gameContainer = document.getElementById('canvas-container');

        const handleStart = (e) => {
            if (this.joystickTouchId !== null) return;
            const touch = e.changedTouches[0];
            this.joystickTouchId = touch.identifier;
            this.joystickStartPos = { x: touch.clientX, y: touch.clientY };

            this.joystickBase.setPosition(touch.clientX, touch.clientY).setVisible(true);
            this.joystickThumb.setPosition(touch.clientX, touch.clientY).setVisible(true);
        };

        const handleMove = (e) => {
            if (this.joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === this.joystickTouchId) {
                    let dx = touch.clientX - this.joystickStartPos.x;
                    let dy = touch.clientY - this.joystickStartPos.y;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 50;

                    if (dist > 0) {
                        let angle = Math.atan2(dy, dx);
                        let clampDist = Math.min(dist, maxDist);

                        this.joystickThumb.setPosition(
                            this.joystickStartPos.x + Math.cos(angle) * clampDist,
                            this.joystickStartPos.y + Math.sin(angle) * clampDist
                        );

                        this.joystickDir = {
                            x: Math.cos(angle) * (clampDist / maxDist),
                            y: Math.sin(angle) * (clampDist / maxDist)
                        };
                    }
                    break;
                }
            }
        };

        const handleEnd = (e) => {
            if (this.joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === this.joystickTouchId) {
                    this.joystickTouchId = null;
                    this.joystickDir = { x: 0, y: 0 };
                    this.joystickBase.setVisible(false);
                    this.joystickThumb.setVisible(false);
                    break;
                }
            }
        };

        gameContainer.addEventListener('touchstart', handleStart, { passive: false });
        gameContainer.addEventListener('touchmove', handleMove, { passive: false });
        gameContainer.addEventListener('touchend', handleEnd, { passive: false });
        gameContainer.addEventListener('touchcancel', handleEnd, { passive: false });
    }

    update() {
        let vx = 0, vy = 0;

        if (this.cursors.left.isDown) vx = -1;
        if (this.cursors.right.isDown) vx = 1;
        if (this.cursors.up.isDown) vy = -1;
        if (this.cursors.down.isDown) vy = 1;

        if (this.joystickDir.x !== 0 || this.joystickDir.y !== 0) {
            vx = this.joystickDir.x;
            vy = this.joystickDir.y;
        }

        let vec = new Phaser.Math.Vector2(vx, vy);
        if (this.joystickDir.x === 0 && this.joystickDir.y === 0) {
            vec.normalize();
        }
        vec.scale(this.moveSpeed);
        
        this.player.body.setVelocity(vec.x, vec.y);

        this.gems.getChildren().forEach(gem => {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, gem.x, gem.y);
            if (dist < 120) {
                this.physics.moveToObject(gem, this.player, 220);
            }
        });
    }

    autoAttack() {
        let nearestEnemy = null;
        let minDistance = 400;

        this.enemies.getChildren().forEach(enemy => {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
            if (dist < minDistance) {
                minDistance = dist;
                nearestEnemy = enemy;
            }
        });

        if (nearestEnemy) {
            let bullet = this.add.circle(this.player.x, this.player.y, 5, 0xffff00);
            this.physics.add.existing(bullet);
            this.bullets.add(bullet);

            let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, nearestEnemy.x, nearestEnemy.y);
            this.physics.velocityFromRotation(angle, 500, bullet.body);
            this.time.delayedCall(2000, () => bullet.destroy());
        }
    }

    spawnEnemy() {
        let angle = Math.random() * Math.PI * 2;
        let spawnDist = 450;
        let x = Phaser.Math.Clamp(this.player.x + Math.cos(angle) * spawnDist, 50, this.mapSize - 50);
        let y = Phaser.Math.Clamp(this.player.y + Math.sin(angle) * spawnDist, 50, this.mapSize - 50);

        let enemy = this.add.circle(x, y, 12, 0xff4444);
        this.physics.add.existing(enemy);
        this.enemies.add(enemy);

        this.physics.moveToObject(enemy, this.player, 80);
    }

    hitEnemy(bullet, enemy) {
        let gem = this.add.circle(enemy.x, enemy.y, 6, 0x00ff88);
        this.physics.add.existing(gem);
        this.gems.add(gem);

        bullet.destroy();
        enemy.destroy();
    }

    collectGem(player, gem) {
        gem.destroy();
        this.exp += 1;

        if (this.exp >= this.maxExp) {
            this.level += 1;
            this.exp = 0;
            this.maxExp = Math.floor(this.maxExp * 1.5);
            this.moveSpeed += 12;
        }

        this.uiText.setText(`等級: ${this.level} | 經驗: ${this.exp}/${this.maxExp}`);
    }
}

const config = {
    type: Phaser.AUTO,
    parent: 'canvas-container',
    width: window.innerWidth,
    height: window.innerHeight,
    scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: GameScene
};

new Phaser.Game(config);
</script>
</body>
</html>
